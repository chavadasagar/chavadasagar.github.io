<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="DevDocs — A digital card catalog for code knowledge across 38 programming subjects and 3,569 indexed topics.">
  <title>DevDocs — Digital Card Catalog for Code</title>

  <!-- Google Fonts: Newsreader (Display Serif), Inter (Clean Humanist Sans), JetBrains Mono (Code/Call Numbers) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,400&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Reading Progress Bar (Fixed at top of viewport) -->
  <div id="readingProgress" class="reading-progress-bar" aria-hidden="true"></div>

  <!-- App Shell Container -->
  <div id="app" class="app-root">

    <!-- Slim 56px Library Top Header -->
    <header class="catalog-header" id="topHeader">
      <div class="header-left">
        <!-- Sidebar collapse toggle -->
        <button id="sidebarToggleBtn" class="catalog-btn-icon" title="Toggle catalog drawer (Ctrl+B)" aria-label="Toggle Catalog Sidebar">
          <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none">
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>

        <!-- Site Title & Tagline -->
        <a href="#/" class="catalog-brand" id="brandLogo">
          <span class="catalog-title">DevDocs</span>
          <span class="catalog-tagline">Card Catalog for Code</span>
        </a>
      </div>

      <!-- Center-Right Library Card-Lookup Box -->
      <div class="header-center">
        <div class="search-box-wrapper">
          <svg class="search-box-icon" viewBox="0 0 24 24" width="15" height="15" stroke="currentColor" stroke-width="2" fill="none">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" id="catalogSearchInput" class="catalog-search-input" placeholder="Search 3,569 topics..." autocomplete="off" spellcheck="false" aria-label="Search catalog">
          <span class="search-kbd-hint"><kbd>/</kbd></span>

          <!-- Search Dropdown Palette -->
          <div id="searchDropdown" class="search-dropdown hidden" role="listbox"></div>
        </div>
      </div>

      <!-- Header Right Controls -->
      <div class="header-right">
        <!-- Last Opened Topic Shortcut -->
        <button id="resumeTopicBtn" class="resume-pill hidden" title="Resume last consulted card">
          <span class="resume-dot"></span>
          <span class="resume-label">Resume</span>
        </button>

        <!-- Dark / Light Theme Toggle -->
        <button id="themeToggleBtn" class="catalog-btn-icon" title="Toggle Light/Dark Theme" aria-label="Toggle Theme">
          <svg class="theme-icon sun-icon" viewBox="0 0 24 24" width="17" height="17" stroke="currentColor" stroke-width="2" fill="none">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
          <svg class="theme-icon moon-icon" viewBox="0 0 24 24" width="17" height="17" stroke="currentColor" stroke-width="2" fill="none">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- Main Workspace Layout -->
    <div class="workspace-body">
      
      <!-- Backdrop for Mobile Drawer -->
      <div id="sidebarBackdrop" class="drawer-backdrop"></div>

      <!-- 280px Persistent Collapsible Sidebar -->
      <aside class="catalog-sidebar" id="appSidebar" aria-label="Catalog Navigation">
        
        <!-- Sidebar Top Tools -->
        <div class="sidebar-top-bar">
          <div class="sidebar-filter-box">
            <input type="text" id="sidebarFilterInput" class="sidebar-filter-input" placeholder="Filter card index..." autocomplete="off">
            <button id="sidebarFilterClear" class="filter-clear-btn hidden" title="Clear filter">✕</button>
          </div>
          <button id="sidebarCollapseToggle" class="sidebar-rail-btn" title="Collapse sidebar to rail">
            <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none">
              <polyline points="11 17 6 12 11 7"></polyline>
              <polyline points="18 17 13 12 18 7"></polyline>
            </svg>
          </button>
        </div>

        <!-- Sidebar Navigation Tree -->
        <nav class="sidebar-tree" id="sidebarNav">
          <div class="catalog-loading-placeholder">
            <div class="skeleton-line" style="width: 70%;"></div>
            <div class="skeleton-line" style="width: 50%;"></div>
            <div class="skeleton-line" style="width: 80%;"></div>
          </div>
        </nav>

        <!-- Sidebar Footer Catalog Meta -->
        <div class="sidebar-bottom-bar">
          <span class="catalog-meta-callout">CATALOG INDEX: 3,569 CARDS</span>
        </div>
      </aside>

      <!-- Main Reading Area (Centered, max-width 680px body) -->
      <main class="catalog-main" id="mainContent">
        <div id="viewContainer" class="view-mount">
          <!-- Views rendered dynamically -->
        </div>
      </main>

    </div>

    <!-- Toast Notification (Library Stamp / Copied Confirmation) -->
    <div id="toastNotification" class="stamp-toast hidden" role="status" aria-live="polite"></div>

  </div>

  <!-- Direct Data Scripts (Zero web server required, instant file:/// execution) -->
  <script src="data/summary_report.js"></script>
  <script src="data/w3schools_master_index.js"></script>

  <!-- Application Engine -->
  <script src="app.js"></script>
</body>
</html>
