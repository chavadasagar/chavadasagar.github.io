<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%20fill%3D%22none%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22g%22%20x1%3D%220%25%22%20y1%3D%220%25%22%20x2%3D%22100%25%22%20y2%3D%22100%25%22%3E%3Cstop%20offset%3D%220%25%22%20stop-color%3D%22%230284C7%22%2F%3E%3Cstop%20offset%3D%22100%25%22%20stop-color%3D%22%234F46E5%22%2F%3E%3C%2FlinearGradient%3E%3C%2Fdefs%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2216%22%20fill%3D%22%23091224%22%2F%3E%3Crect%20x%3D%222%22%20y%3D%222%22%20width%3D%2260%22%20height%3D%2260%22%20rx%3D%2214%22%20stroke%3D%22url(%23g)%22%20stroke-width%3D%222%22%20stroke-opacity%3D%220.6%22%2F%3E%3Cpath%20d%3D%22M14%2044c6-4%2012-4%2018%200%206-4%2012-4%2018%200V18c-6-4-12-4-18%200-6-4-12-4-18%200v26z%22%20stroke%3D%22url(%23g)%22%20stroke-width%3D%222.5%22%20fill%3D%22%2310203e%22%2F%3E%3Cpath%20d%3D%22M32%2018v26%22%20stroke%3D%22%230284C7%22%20stroke-width%3D%222.5%22%20stroke-linecap%3D%22round%22%2F%3E%3C%2Fsvg%3E">
  <link rel="shortcut icon" href="favicon.svg">
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | AegisLib - Library Management System</title>
    <!-- Fonts and Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- CSS Stylesheets -->
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/dashboard.css">
    <link rel="stylesheet" href="./css/table.css">
    <link rel="stylesheet" href="./css/responsive.css">
</head>
<body>
    <div id="app-layout">
        <!-- Sidebar and Top Navbar injected dynamically here -->
        <div class="content-body">
            <!-- KPI Metrics Row -->
            <div class="dashboard-grid">
                <div class="card kpi-card">
                    <div class="kpi-icon"><i class="fas fa-book"></i></div>
                    <div class="kpi-details">
                        <span class="kpi-value" id="kpi-total-books">-</span>
                        <span class="kpi-label">Total Books</span>
                    </div>
                </div>
                <div class="card kpi-card available">
                    <div class="kpi-icon"><i class="fas fa-check-circle"></i></div>
                    <div class="kpi-details">
                        <span class="kpi-value" id="kpi-available-books">-</span>
                        <span class="kpi-label">Available Copies</span>
                    </div>
                </div>
                <div class="card kpi-card info">
                    <div class="kpi-icon"><i class="fas fa-exchange-alt"></i></div>
                    <div class="kpi-details">
                        <span class="kpi-value" id="kpi-issued-books">-</span>
                        <span class="kpi-label">Issued Copies</span>
                    </div>
                </div>
                <div class="card kpi-card overdue">
                    <div class="kpi-icon"><i class="fas fa-exclamation-triangle"></i></div>
                    <div class="kpi-details">
                        <span class="kpi-value" id="kpi-overdue-loans">-</span>
                        <span class="kpi-label">Overdue Loans</span>
                    </div>
                </div>
                <div class="card kpi-card reservations">
                    <div class="kpi-icon"><i class="fas fa-bookmark"></i></div>
                    <div class="kpi-details">
                        <span class="kpi-value" id="kpi-reservations">-</span>
                        <span class="kpi-label">Active Holds</span>
                    </div>
                </div>
                <div class="card kpi-card">
                    <div class="kpi-icon"><i class="fas fa-users"></i></div>
                    <div class="kpi-details">
                        <span class="kpi-value" id="kpi-total-members">-</span>
                        <span class="kpi-label">Total Members</span>
                    </div>
                </div>
                <div class="card kpi-card fines">
                    <div class="kpi-icon"><i class="fas fa-file-invoice-dollar"></i></div>
                    <div class="kpi-details">
                        <span class="kpi-value" id="kpi-fines-collected">-</span>
                        <span class="kpi-label">Outstanding Fines</span>
                    </div>
                </div>
            </div>

            <!-- Charts Row -->
            <div class="charts-grid">
                <div class="card">
                    <div class="card-title">
                        <span>Borrowing Volume Over Time</span>
                        <i class="fas fa-chart-line" style="color: var(--text-muted);"></i>
                    </div>
                    <div class="chart-container">
                        <div class="chart-tooltip" id="line-chart-tooltip"></div>
                        <svg id="line-chart-svg" class="chart-svg" viewBox="0 0 600 240"></svg>
                    </div>
                </div>
                <div class="card">
                    <div class="card-title">
                        <span>Books by Category</span>
                        <i class="fas fa-chart-pie" style="color: var(--text-muted);"></i>
                    </div>
                    <div class="chart-container" style="flex-direction: column;">
                        <svg id="donut-chart-svg" class="chart-svg" viewBox="0 0 200 200" style="max-height: 180px;"></svg>
                        <div class="chart-legend" id="donut-legend"></div>
                    </div>
                </div>
            </div>

            <!-- Recent Loans Table -->
            <div class="card">
                <div class="card-title" style="margin-bottom: 1.25rem;">
                    <span>Recent Circulation Activity</span>
                    <a href="./pages/loans.html" class="btn btn-secondary" style="padding: 0.35rem 0.75rem; font-size: 0.8rem;">
                        View All
                    </a>
                </div>
                <div class="table-wrapper">
                    <table class="data-table" id="recent-loans-table">
                        <thead>
                            <tr>
                                <th>Book Title</th>
                                <th>Member</th>
                                <th>Issue Date</th>
                                <th>Due Date</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="recent-loans-tbody">
                            <!-- Populated by JavaScript -->
                            <tr>
                                <td colspan="5" style="text-align: center; color: var(--text-secondary);">Loading activity...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Script modules -->
    <script src="./js/storage.js"></script>
    <script src="./js/utils.js"></script>
    <script src="./js/auth.js"></script>
    <script src="./js/app.js"></script>
    <script src="./js/dashboard.js"></script>
</body>
</html>
