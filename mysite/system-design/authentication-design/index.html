<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Auth Module Tutorial</title>
<style>
:root{--bg:#fff;--card:#f3f6fa;--tx:#1d2733;--mu:#5a6877;--ac:#2563eb;--bd:#d5dde6;--ok:#15803d;--er:#b91c1c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root:not([data-theme=light]){color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#10161d;--card:#1a232d;--tx:#e6edf3;--mu:#9aa8b6;--ac:#60a5fa;--bd:#2d3945;--ok:#4ade80;--er:#f87171;color-scheme:dark}}
:root[data-theme=dark]{--bg:#10161d;--card:#1a232d;--tx:#e6edf3;--mu:#9aa8b6;--ac:#60a5fa;--bd:#2d3945;--ok:#4ade80;--er:#f87171;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;display:flex;gap:10px;align-items:center;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--bd)}
header b{flex:1}button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:6px;padding:6px 12px}
#menu{display:none}
nav{position:fixed;top:52px;bottom:0;left:0;width:260px;overflow:auto;padding:12px;background:var(--card);border-right:1px solid var(--bd)}
nav a{display:block;padding:8px 10px;border-radius:6px;color:var(--tx);text-decoration:none;font-size:15px}nav a.on{background:var(--ac);color:#fff}
main{margin-left:260px;padding:20px 28px;max-width:980px}
.memo{background:var(--card);border-left:4px solid var(--ac);padding:10px 14px;border-radius:6px;margin:12px 0 20px}
.memo b{color:var(--ac)}h1{margin-top:0}h2{margin-top:28px;border-bottom:1px solid var(--bd);padding-bottom:4px}
.w{overflow-x:auto;margin:10px 0}table{border-collapse:collapse;font-size:14px;min-width:100%}th,td{border:1px solid var(--bd);padding:6px 9px;text-align:left;vertical-align:top}th{background:var(--card)}
pre{background:var(--card);border:1px solid var(--bd);padding:10px;border-radius:6px;overflow:auto;font-size:13px;margin:6px 0}
code{background:var(--card);padding:1px 5px;border-radius:4px}
.m{display:inline-block;font-weight:700;color:#fff;background:var(--ac);border-radius:4px;padding:1px 8px;margin-right:6px}
.ok{color:var(--ok)}.er{color:var(--er)}
svg{max-width:100%;height:auto;font-size:12px}svg text{fill:var(--tx)}svg .b{fill:var(--card);stroke:var(--ac);stroke-width:1.5}svg .l{stroke:var(--mu);stroke-width:1.3;stroke-dasharray:4 3;fill:none}svg .a{stroke:var(--mu);stroke-width:1.5;fill:none}svg .r{fill:var(--er)}
.next{margin:30px 0 40px;text-align:right}.next button{background:var(--ac);color:#fff;border:0;padding:10px 22px}
@media(max-width:800px){#menu{display:block}nav{transform:translateX(-100%);transition:.2s;z-index:6;width:80%}nav.open{transform:none}main{margin:0;padding:14px}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7a8794"/></marker></defs></svg>
<header><button id="menu">☰</button><b>🔐 Auth Module Tutorial</b><button id="th">🌓</button></header>
<nav id="nav"></nav>
<main id="main"></main>
<script>
const tbl=(h,r)=>`<div class=w><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${r.map(x=>`<tr>${x.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</table></div>`;
const J=o=>'<pre>'+JSON.stringify(o,null,1)+'</pre>';
const ep=(m,u,rq,ok,er)=>`<h3><span class=m>${m}</span><code>${u}</code></h3>${rq?'<b>Request</b>'+J(rq):'<b>Request:</b> body nahi (Authorization header / cookie)<br>'}<b class=ok>Success 200</b>${J(ok)}<b class=er>Errors</b><ul>${er.map(e=>`<li>${e}</li>`).join('')}</ul>`;
function seq(a,m){const W=170,n=a.length,w=W*n,h=50+m.length*36;let s=`<div class=w><svg viewBox="0 0 ${w} ${h}" style="min-width:${Math.min(w,640)}px">`;
a.forEach((x,i)=>{const c=W*i+W/2;s+=`<rect class=b x=${c-55} y=4 width=110 height=26 rx=5 /><text x=${c} y=22 text-anchor=middle>${x}</text><line class=l x1=${c} y1=30 x2=${c} y2=${h} />`});
m.forEach((e,i)=>{const y=58+i*36,x1=W*e[0]+W/2,x2=W*e[1]+W/2;
if(x1==x2)s+=`<path class=a d="M${x1} ${y-8}h40v16h-40" marker-end="url(#ar)" /><text x=${x1+46} y=${y+4}>${e[2]}</text>`;
else s+=`<line class=a x1=${x1} y1=${y} x2=${x2} y2=${y} marker-end="url(#ar)" ${e[3]?'stroke-dasharray="5 3"':''} /><text x=${(x1+x2)/2} y=${y-6} text-anchor=middle>${e[2]}</text>`});
return s+'</svg></div>'}
function flow(a){let y=6,s='';a.forEach((t,i)=>{const d=t[0]=='?',[l,side]=t.replace('?','').split('|'),hh=d?54:36;
if(i)s+=`<line class=a x1=130 y1=${y-22} x2=130 y2=${y-2} marker-end="url(#ar)" />`;
s+=d?`<polygon class=b points="130,${y} 250,${y+27} 130,${y+54} 10,${y+27}" />`:`<rect class=b x=10 y=${y} width=240 height=36 rx=6 />`;
s+=`<text x=130 y=${y+hh/2+4} text-anchor=middle>${l}</text>`;if(side)s+=`<text class=r x=262 y=${y+hh/2+4}>${side}</text>`;y+=hh+24});
return `<div class=w><svg viewBox="0 0 520 ${y}" style="min-width:420px">${s}</svg></div>`}
const box=(x,y,w,t)=>`<rect class=b x=${x} y=${y} width=${w} height=34 rx=6 /><text x=${x+w/2} y=${y+21} text-anchor=middle>${t}</text>`;
const ar=(a,b,c,d)=>`<line class=a x1=${a} y1=${b} x2=${c} y2=${d} marker-end="url(#ar)" />`;

const S=[
["1. Overview","Auth module = app ka darwaza. Pehle pehchano (login), phir andar jaane do. Poore tutorial me ek hi user: <b>Rahul Sharma</b> (rahul@example.com).",
`<h2>Module kya karta hai?</h2><p>Auth module user ko <b>register</b>, <b>login</b>, <b>logout</b> aur <b>password reset</b> karne deta hai. Login ke baad API ek <b>JWT access token</b> (15 min) aur ek <b>refresh token</b> (7 din) deta hai. Isko har end-user use karta hai (Rahul jaise customer), aur baaki saare modules is token ko check karke hi kaam karte hain. Passwords kabhi plain text me save nahi hote — sirf hash.</p>
<h2>Architecture / Flow diagram</h2><div class=w><svg viewBox="0 0 700 150" style="min-width:600px">${box(10,20,110,'Browser (UI)')}${box(170,20,120,'ASP.NET API')}${box(340,20,130,'Application (CQRS)')}${box(520,20,110,'PostgreSQL')}${ar(120,37,170,37)}${ar(290,37,340,37)}${ar(470,37,520,37)}${box(340,100,130,'Email Service')}${ar(405,54,405,100)}<text x=10 y=90>JWT + Refresh token wapas UI ko</text></svg></div>
${tbl(['Part','Kaam'],[['UI','Forms dikhata hai, token store karta hai'],['API Controller','Request leta hai, Application ko pass karta hai'],['Application','Business rules (password check, token banana)'],['PostgreSQL','Users, RefreshTokens, PasswordResetTokens'],['Email Service','Reset link bhejta hai']])}`],

["2. Tables","Sirf 3 tables: Users, RefreshTokens, PasswordResetTokens. Token ka hash save hota hai, asli token nahi.",
`<h2>users</h2><p>Purpose: har registered account ek row.</p>${tbl(['Column','Type','Key','Note'],[['id','uuid','PK',''],['email','varchar(150)','UNIQUE','login ID'],['password_hash','varchar(200)','','BCrypt hash'],['full_name','varchar(100)','',''],['status','varchar(10)','','Active / Locked'],['failed_attempts','int','','galat password count'],['created_at','timestamptz','','']])}
${tbl(['id','email','full_name','status','failed_attempts'],[['u-101','rahul@example.com','Rahul Sharma','Active','0'],['u-102','priya@example.com','Priya Patel','Locked','5']])}
<h2>refresh_tokens</h2><p>Purpose: login session. Logout = row revoke.</p>${tbl(['Column','Type','Key'],[['id','uuid','PK'],['user_id','uuid','FK → users.id'],['token_hash','varchar(100)',''],['expires_at','timestamptz',''],['revoked_at','timestamptz (null)',''],['created_at','timestamptz','']])}
${tbl(['id','user_id','expires_at','revoked_at'],[['t-1','u-101','2026-10-23','null'],['t-0','u-101','2026-10-20','2026-10-16']])}
<h2>password_reset_tokens</h2><p>Purpose: forgot password ka one-time link.</p>${tbl(['Column','Type','Key'],[['id','uuid','PK'],['user_id','uuid','FK → users.id'],['token_hash','varchar(100)',''],['expires_at','timestamptz','30 min'],['used_at','timestamptz (null)','']])}
${tbl(['id','user_id','expires_at','used_at'],[['r-1','u-101','2026-10-16 10:30','null']])}
<h2>ER diagram</h2><div class=w><svg viewBox="0 0 620 110" style="min-width:520px">${box(10,35,120,'refresh_tokens')}${box(250,35,100,'users')}${box(470,35,140,'password_reset_tokens')}${ar(250,52,130,52)}${ar(350,52,470,52)}<text x=140 y=45>N : 1</text><text x=375 y=45>1 : N</text></svg></div><p>Ek user ke <b>kai</b> tokens ho sakte hain (kai devices).</p>`],

["3. Flow","Login ka flow sabse important hai. Baaki operations usi pattern par chalte hain.",
`<h2>Login flowchart</h2>${flow(['Rahul email + password bhejta hai','?User mila?|Nahi → 401','?Status Locked?|Haan → 423','?Password sahi?|Nahi → failed_attempts+1 (5 pe Locked)','failed_attempts = 0','JWT + refresh token banao, DB me hash save','200 OK + tokens'])}
<h2>Sequence: Login</h2>${seq(['User','UI','API','DB'],[[0,1,'email, password'],[1,2,'POST /login'],[2,3,'SELECT user'],[3,2,'user row',1],[2,2,'hash verify'],[2,3,'INSERT refresh_token'],[2,1,'200 + tokens',1],[1,0,'Dashboard',1]])}
<h2>Sequence: Register</h2>${seq(['User','UI','API','DB'],[[0,1,'form submit'],[1,2,'POST /register'],[2,3,'email exists?'],[2,3,'INSERT user'],[2,1,'201 Created',1],[1,0,'Login screen',1]])}
<h2>Sequence: Forgot + Reset Password</h2>${seq(['User','API','DB','Email'],[[0,1,'forgot-password'],[1,2,'INSERT reset_token'],[1,3,'reset link bhejo'],[3,0,'Email aaya',1],[0,1,'reset-password + token'],[1,2,'UPDATE password, used_at'],[1,2,'REVOKE refresh tokens'],[1,0,'200 OK',1]])}
<h2>State diagram: users.status</h2><div class=w><svg viewBox="0 0 520 110" style="min-width:420px">${box(30,35,100,'Active')}${box(370,35,100,'Locked')}${ar(130,45,370,45)}${ar(370,65,130,65)}<text x=165 y=38>5 galat attempts</text><text x=165 y=82>Password reset ke baad</text></svg></div>`],

["4. Screens","5 screens. Register, Login, Forgot, Reset — aur login ke baad Dashboard.",
`${tbl(['#','Screen','Kaam'],[['1','Register','Naya account banana'],['2','Login','Email + password se andar aana'],['3','Forgot Password','Email dena, reset link mangna'],['4','Reset Password','Email wale link se naya password set'],['5','Dashboard','Login ke baad home; yahan Logout button hai']])}
<h2>Navigation flow</h2><div class=w><svg viewBox="0 0 700 170" style="min-width:600px">${box(10,10,100,'Register')}${box(200,10,100,'Login')}${box(390,10,110,'Dashboard')}${box(200,100,120,'Forgot Password')}${box(420,100,120,'Reset Password')}${ar(110,27,200,27)}${ar(300,27,390,27)}${ar(250,44,250,100)}${ar(320,117,420,117)}${ar(480,100,290,44)}<text x=120 y=20>register ho gaya</text><text x=310 y=20>login OK</text><text x=330 y=110>email link</text></svg></div>`],

["5. API Endpoints","Saare endpoints <code>/api/auth</code> ke neeche. Error hamesha JSON me: <code>{message}</code>.",
ep('POST','/api/auth/register',{fullName:"Rahul Sharma",email:"rahul@example.com",password:"Rahul@123"},{userId:"u-101",message:"Account ban gaya"},['400 – Password weak','409 – Email already registered'])+
ep('POST','/api/auth/login',{email:"rahul@example.com",password:"Rahul@123"},{accessToken:"eyJhbGci...",refreshToken:"rt_9f3a...",expiresIn:900},['401 – Email ya password galat','423 – Account locked'])+
ep('POST','/api/auth/refresh',{refreshToken:"rt_9f3a..."},{accessToken:"eyJhbGci...",refreshToken:"rt_new1..."},['401 – Token invalid / expired / revoked'])+
ep('POST','/api/auth/logout',{refreshToken:"rt_9f3a..."},{message:"Logout ho gaya"},['401 – Access token missing'])+
ep('POST','/api/auth/forgot-password',{email:"rahul@example.com"},{message:"Agar email registered hai to link bhej diya gaya"},['400 – Email format galat'])+
ep('POST','/api/auth/reset-password',{token:"reset_ab12...",newPassword:"Rahul@456"},{message:"Password badal gaya"},['400 – Token invalid / expired / used','400 – Password weak'])],

["6. API-to-Table Mapping","Rule: forgot-password hamesha same response deta hai — taaki koi email guess na kar sake.",
tbl(['Endpoint + Method','Business operation','Read','Insert','Update','Delete / Revoke','DB kab trigger hoga'],[
['POST /register','Naya account','users','users','—','—','Email unique + password rule pass'],
['POST /login','Login','users','refresh_tokens','users (failed_attempts, status)','—','Sahi password → token insert, attempts=0. Galat → attempts+1, 5 pe Locked'],
['POST /refresh','Naya token lena','refresh_tokens, users','refresh_tokens (naya)','—','refresh_tokens (purana revoked_at)','Token valid, not expired, not revoked'],
['POST /logout','Logout','refresh_tokens','—','—','refresh_tokens (revoked_at)','Token mila aur user ka apna hai'],
['POST /forgot-password','Reset link mangna','users','password_reset_tokens','—','—','Email registered ho (warna kuch nahi, response same)'],
['POST /reset-password','Naya password','password_reset_tokens','—','users (password_hash, status=Active), password_reset_tokens (used_at)','refresh_tokens (user ke sab revoke)','Token valid, used_at null, expire nahi']])],

["7. Screen-to-Table + Validation","Validation pehle UI me (turant feedback), phir API me bhi (asli suraksha).",
tbl(['Screen','User action','Table insert / update','Validation rule','Error message'],[
['Register','Submit','users insert','Email format; password 8+ chars, 1 number, 1 capital','“Email sahi nahi hai” / “Password kam se kam 8 character, 1 number aur 1 capital ka ho” / “Ye email pehle se registered hai”'],
['Login','Login click','refresh_tokens insert; users update (attempts)','Email aur password khali na ho','“Email ya password galat hai” / “Account lock hai, password reset karein”'],
['Forgot Password','Link bhejo','password_reset_tokens insert','Email format sahi ho','“Email sahi nahi hai” (success pe: “Agar email registered hai to link bhej diya gaya”)'],
['Reset Password','Save','users update; password_reset_tokens update','Password rule; confirm password match','“Password match nahi kar rahe” / “Link expire ho gaya, dobara mangwayein”'],
['Dashboard','Logout','refresh_tokens update (revoked_at)','Login hona chahiye','“Session expire ho gaya, dobara login karein”']])],

["8. Transaction Boundary","Rule: jo changes saath me hone chahiye, ek DB transaction me. Email transaction ke <b>bahar</b> bhejo.",
tbl(['Operation','Ek transaction me','Atomic?','Commit ke baad','Email/SMS fail','Retry se duplicate risk','Idempotency'],[
['Register','users insert','Haan','201 return','Welcome email optional; fail = ignore','Same email 2 baar → duplicate user','users.email UNIQUE; 2nd request ko 409 do'],
['Login','refresh_tokens insert + users.failed_attempts reset','Haan','Tokens return','Email nahi hota','Do tokens ban sakte hain','Harmless — har device ka alag token; purane expire ho jaate hain'],
['Refresh','Naya token insert + purana revoke','Haan (dono ya koi nahi)','Naya token return','Email nahi hota','Do refresh ek saath → 2 naye tokens','Purane token par <code>revoked_at IS NULL</code> wali conditional UPDATE; 2nd request fail'],
['Forgot Password','reset_token insert','Haan','Email bhejo','Fail ho to log + background retry; user dobara try kar sakta hai','Do links ban sakte hain','Naya token banate waqt purane unused tokens expire kar do'],
['Reset Password','users update + used_at set + refresh_tokens revoke','Haan — sab ya kuch nahi','200 return','Confirmation email fail = ignore','Same link 2 baar use','<code>UPDATE ... WHERE used_at IS NULL</code>; 0 rows update → 400']])],

["9. Edge Cases","Real life me user double click karta hai, net toot jaata hai. Pehle se socho.",
tbl(['Scenario','Kya hoga','Solution'],[
['Register par double click','2 requests ek saath','UI me button disable; DB me UNIQUE email → 2nd ko 409'],
['Login ke time network timeout','Server ne token bana diya, UI ko response nahi mila','User dobara login kare — naya token mil jayega. Purane tokens expiry par khatam'],
['Forgot password: DB me token bana, email fail','User ko link nahi mila','Email retry queue me; user dobara “Forgot password” dabaye'],
['Reset par partial failure (password update hua, revoke nahi)','Purane sessions zinda rahenge — khatarnak','Teeno steps ek transaction me; fail → rollback'],
['2 devices se ek hi refresh token ek saath','Dono naya token chahte hain','Conditional UPDATE (revoked_at IS NULL); ek jeetega, doosre ko 401 → re-login'],
['Galat password baar-baar (brute force)','Attacker guess karta hai','5 attempts par Locked; IP par rate limit']])],

["10. Folder Structure","Clean Architecture: andar wali layer bahar wali ko nahi jaanti. Domain sabse andar.",
`<pre>Auth/
├── Auth.Domain/            # Entities aur rules, kisi par depend nahi
│   ├── Entities/           # User, RefreshToken, PasswordResetToken
│   └── Enums/              # UserStatus (Active, Locked)
├── Auth.Application/       # Business logic (CQRS)
│   ├── Commands/           # Register, Login, Refresh, Logout, ResetPassword
│   ├── Queries/            # Read-only operations
│   ├── Interfaces/         # IUserRepository, IEmailSender, ITokenService
│   └── Validators/         # Password / email validation rules
├── Auth.Infrastructure/    # Bahar ki duniya se baat
│   ├── Persistence/        # DbContext, EF Core configs, migrations (PostgreSQL)
│   ├── Repositories/       # Interfaces ka asli DB code
│   ├── Security/           # BCrypt hasher, JWT generator
│   └── Email/              # Email sender implementation
└── Auth.Api/               # ASP.NET Core Web API
    ├── Controllers/        # AuthController (6 endpoints)
    ├── Middleware/         # Global error handling
    └── Program.cs          # DI setup, JWT config</pre>`]
];

const nav=document.getElementById('nav'),main=document.getElementById('main');
S.forEach((s,i)=>{const a=document.createElement('a');a.href='#'+i;a.textContent=s[0];nav.appendChild(a)});
function show(){let i=parseInt(location.hash.slice(1))||0;if(!S[i])i=0;const s=S[i];
main.innerHTML=`<h1>${s[0]}</h1><div class=memo><b>💡 Yaad rakhne wali baat:</b> ${s[1]}</div>${s[2]}<div class=next>${S[i+1]?`<button onclick="location.hash=${i+1}">Next → ${S[i+1][0].replace(/^\d+\. /,'')}</button>`:'<b class=ok>Tutorial complete ✓</b>'}</div>`;
[...nav.children].forEach((a,j)=>a.classList.toggle('on',j==i));nav.classList.remove('open');scrollTo(0,0)}
addEventListener('hashchange',show);show();
document.getElementById('menu').onclick=()=>nav.classList.toggle('open');
document.getElementById('th').onclick=()=>{const d=document.documentElement,cur=d.dataset.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'),n=cur=='dark'?'light':'dark';d.dataset.theme=n;try{localStorage.setItem('t',n)}catch(e){}};
try{const t=localStorage.getItem('t');if(t)document.documentElement.dataset.theme=t}catch(e){}
</script>
</body>
</html>
