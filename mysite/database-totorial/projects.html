<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All Database Design Projects | DB Masterclass</title>
  
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/responsive.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="scroll-progress-bar"></div>

  <!-- Navigation Bar -->
  <header class="navbar">
    <div class="container nav-wrap">
      <a href="index.html" class="logo-brand">
        <div class="logo-icon">🗄️</div>
        <span>DB Masterclass</span>
      </a>

      <nav class="nav-links">
        <a href="index.html" class="nav-link">Home</a>
        <a href="projects.html" class="nav-link active">Projects</a>
        <a href="concepts.html" class="nav-link">Concepts</a>
        <a href="er-diagrams.html" class="nav-link">ER Diagrams</a>
        <a href="quiz.html" class="nav-link">Quiz</a>
        <a href="about.html" class="nav-link">About</a>
      </nav>

      <div class="nav-actions">
        <button class="icon-btn" id="search-modal-btn" title="Search">🔍</button>
        <button class="icon-btn" id="theme-toggle-btn" onclick="toggleTheme()">🌙</button>
        <button class="icon-btn mobile-hamburger" id="mobile-menu-btn" title="Toggle Navigation Menu">☰</button>
      </div>
    </div>
  </header>

  <!-- Page Header -->
  <section style="padding: 3rem 0 1.5rem;">
    <div class="container">
      <div style="display:flex; justify-content:space-between; align-items:flex-end;">
        <div>
          <h1>Database Project Catalog</h1>
          <p class="sub-text">Explore 11+ production database design courses with schema deep-dives.</p>
        </div>
        <div style="font-size:0.9rem; color:var(--text-muted);">
          Showing <span id="projects-count" style="font-weight:700; color:var(--accent-cyan);">11</span> Courses
        </div>
      </div>

      <!-- Controls -->
      <div style="margin-top:2rem; display:flex; flex-direction:column; gap:1.25rem;">
        <div class="search-modal-input-wrap" style="background:var(--bg-card); border:1px solid var(--border-color); border-radius:var(--radius-md); padding:0.85rem 1.25rem;">
          <span>🔍</span>
          <input type="text" id="projects-search" placeholder="Search by project name, industry, table, or concept (e.g. SaaS, cart, orders)...">
        </div>

        <!-- Filter Pills -->
        <div class="filter-pills" id="projects-filter-pills">
          <button class="pill active" data-filter="ALL">All Projects</button>
          <button class="pill" data-filter="BEGINNER">Beginner</button>
          <button class="pill" data-filter="INTERMEDIATE">Intermediate</button>
          <button class="pill" data-filter="ADVANCED">Advanced</button>
          <button class="pill" data-filter="SAAS">SaaS</button>
          <button class="pill" data-filter="E-COMMERCE">E-Commerce</button>
          <button class="pill" data-filter="HEALTHCARE">Healthcare</button>
          <button class="pill" data-filter="BOOKING">Booking</button>
          <button class="pill" data-filter="MANAGEMENT">Management Systems</button>
        </div>
      </div>
    </div>
  </section>

  <!-- Projects Grid -->
  <main style="padding: 2rem 0 5rem;">
    <div class="container">
      <div class="card-grid" id="all-projects-grid">
        <!-- Rendered via js/projects.js -->
      </div>
    </div>
  </main>

  <!-- Global Search Modal -->
  <div class="search-modal-overlay" id="global-search-modal">
    <div class="search-modal-content">
      <div class="search-modal-input-wrap">
        <span>🔍</span>
        <input type="text" id="global-search-input" placeholder="Search projects, modules, tables, or concepts...">
      </div>
      <div class="search-modal-results" id="global-search-results"></div>
    </div>
  </div>

  <button class="back-to-top" title="Back to Top">↑</button>

  <footer class="footer">
    <div class="container">
      <div class="footer-bottom">
        <p>© 2026 Database Design Masterclass • Created by Sagar Chavada</p>
        <p>Built with Pure HTML5, CSS3 & Vanilla JavaScript</p>
      </div>
    </div>
  </footer>

  <script src="data/projects-data.js"></script>
  <script src="data/concepts-data.js"></script>
  <script src="data/quiz-data.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/progress.js"></script>
  <script src="js/bookmarks.js"></script>
  <script src="js/search.js"></script>
  <script src="js/projects.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
