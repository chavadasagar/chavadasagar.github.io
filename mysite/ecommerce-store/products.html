<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%20fill%3D%22none%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22g%22%20x1%3D%220%25%22%20y1%3D%220%25%22%20x2%3D%22100%25%22%20y2%3D%22100%25%22%3E%3Cstop%20offset%3D%220%25%22%20stop-color%3D%22%232563EB%22%2F%3E%3Cstop%20offset%3D%22100%25%22%20stop-color%3D%22%2310B981%22%2F%3E%3C%2FlinearGradient%3E%3C%2Fdefs%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2216%22%20fill%3D%22%2308131d%22%2F%3E%3Crect%20x%3D%222%22%20y%3D%222%22%20width%3D%2260%22%20height%3D%2260%22%20rx%3D%2214%22%20stroke%3D%22url(%23g)%22%20stroke-width%3D%222%22%20stroke-opacity%3D%220.6%22%2F%3E%3Cpath%20d%3D%22M14%2016h6l5%2022h22l4-16H22%22%20stroke%3D%22url(%23g)%22%20stroke-width%3D%222.5%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%20fill%3D%22%230f253a%22%2F%3E%3Ccircle%20cx%3D%2227%22%20cy%3D%2246%22%20r%3D%223.5%22%20fill%3D%22%2310B981%22%2F%3E%3Ccircle%20cx%3D%2243%22%20cy%3D%2246%22%20r%3D%223.5%22%20fill%3D%22%2310B981%22%2F%3E%3C%2Fsvg%3E">
  <link rel="shortcut icon" href="favicon.svg">
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop Products - ShopEase</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/responsive.css">
    <style>
        /* PLP Layout customization */
        .plp-container {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .filter-sidebar {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 18px;
            display: none; /* Collapsed by default on mobile */
        }

        .filter-sidebar.show {
            display: block;
        }

        .filter-section {
            border-bottom: 1px solid var(--border);
            padding-bottom: 16px;
            margin-bottom: 16px;
        }

        .filter-section:last-child {
            border-bottom: none;
            padding-bottom: 0;
            margin-bottom: 0;
        }

        .filter-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--text-main);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .filter-option-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-size: 13px;
        }

        .price-range-inputs {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .price-input-box {
            width: 80px;
            padding: 6px 10px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            outline: none;
            font-size: 13px;
        }

        /* Sorting Header block */
        .catalog-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            gap: 12px;
            flex-wrap: wrap;
        }

        .results-count {
            font-size: 14px;
            color: var(--text-muted);
        }

        .sort-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .sort-select {
            padding: 6px 10px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            background-color: var(--bg-card);
            outline: none;
            font-size: 13px;
        }

        @media(min-width: 1025px) {
            .plp-container {
                flex-direction: row;
            }
            .filter-sidebar {
                display: block;
                width: 260px;
                flex-shrink: 0;
                position: sticky;
                top: 94px; /* sticky beneath header */
                height: fit-content;
            }
            .mobile-filter-trigger {
                display: none !important;
            }
        }
    </style>
</head>
<body>

    <!-- Header Injector Placeholder -->
    <div id="header-placeholder"></div>

    <main class="container">
        <!-- Breadcrumbs -->
        <div class="breadcrumb">
            <a href="index.html">Home</a>
            <span class="breadcrumb-separator">&rarr;</span>
            <span class="breadcrumb-item active" id="breadcrumb-category">All Products</span>
        </div>

        <!-- Filter Trigger Button on Mobile -->
        <div class="mobile-filter-trigger mb-4" style="display: flex; gap: 12px;">
            <button class="btn btn-outline btn-full flex-align-center" id="mobile-filter-btn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
                <span>Filters</span>
            </button>
        </div>

        <div class="plp-container">
            <!-- 1. Left Sidebar Filters -->
            <aside class="filter-sidebar" id="filter-sidebar">
                <div class="filter-section">
                    <div class="filter-title">
                        <span>Categories</span>
                    </div>
                    <ul class="filter-option-list" id="filter-category-list">
                        <!-- Categories dynamically loaded -->
                    </ul>
                </div>

                <div class="filter-section">
                    <div class="filter-title">
                        <span>Brands</span>
                    </div>
                    <ul class="filter-option-list" id="filter-brand-list">
                        <!-- Brands dynamically loaded -->
                    </ul>
                </div>

                <div class="filter-section">
                    <div class="filter-title">
                        <span>Price Range (â‚¹)</span>
                    </div>
                    <div class="price-range-inputs mb-3">
                        <input type="number" id="price-min" class="price-input-box" placeholder="Min" min="0">
                        <span class="text-muted">-</span>
                        <input type="number" id="price-max" class="price-input-box" placeholder="Max" min="0">
                    </div>
                    <button class="btn btn-primary btn-sm btn-full" id="apply-price-filter-btn">
                        Apply Price
                    </button>
                </div>

                <div class="filter-section">
                    <div class="filter-title">
                        <span>Customer Rating</span>
                    </div>
                    <ul class="filter-option-list">
                        <li>
                            <label class="form-checkbox-label">
                                <input type="radio" name="rating-filter" value="4" class="form-checkbox">
                                <span>â­ 4 & above</span>
                            </label>
                        </li>
                        <li>
                            <label class="form-checkbox-label">
                                <input type="radio" name="rating-filter" value="3" class="form-checkbox">
                                <span>â­ 3 & above</span>
                            </label>
                        </li>
                        <li>
                            <label class="form-checkbox-label">
                                <input type="radio" name="rating-filter" value="0" class="form-checkbox" checked>
                                <span>Show All</span>
                            </label>
                        </li>
                    </ul>
                </div>

                <button class="btn btn-outline btn-sm btn-full mt-4" id="clear-filters-btn">
                    Reset All Filters
                </button>
            </aside>

            <!-- 2. Right Products Grid Content -->
            <section style="flex-grow: 1;">
                <!-- Result counters & sorting -->
                <div class="catalog-header">
                    <div class="results-count" id="results-count">
                        Showing 0 items
                    </div>
                    <div class="sort-container">
                        <span class="text-muted" style="font-size:13px; font-weight:500;">Sort By:</span>
                        <select id="sort-selector" class="sort-select">
                            <option value="newest">Newest Arrivals</option>
                            <option value="price-asc">Price: Low to High</option>
                            <option value="price-desc">Price: High to Low</option>
                            <option value="rating">Customer Rating</option>
                        </select>
                    </div>
                </div>

                <!-- Products Grid -->
                <div class="product-grid" id="plp-products-grid">
                    <!-- Dynamic rendering -->
                </div>

                <!-- Empty state for search failure -->
                <div class="empty-state d-none" id="plp-empty-state">
                    <span class="empty-state-icon">ðŸ”</span>
                    <h3 class="empty-state-title">No Matching Products</h3>
                    <p class="empty-state-desc">We couldn't find anything matching your filters or query. Try resetting filters.</p>
                    <button class="btn btn-primary" id="empty-state-reset-btn">Clear Search</button>
                </div>
            </section>
        </div>
    </main>

    <!-- Footer Placeholder -->
    <div id="footer-placeholder"></div>

    <!-- Scripts -->
    <script src="js/db.js"></script>
    <script src="js/seed.js"></script>
    <script src="js/ui-helpers.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/products.js"></script>
    <script src="js/main.js"></script>

    <script>
        // Track current applied filters state globally
        let currentFilters = {
            q: '',
            category: '',
            brands: [],
            minPrice: '',
            maxPrice: '',
            minRating: 0,
            sort: 'newest'
        };

        document.addEventListener('DOMContentLoaded', () => {
            // Read query params from URL
            const urlParams = new URLSearchParams(window.location.search);
            currentFilters.q = urlParams.get('q') || '';
            currentFilters.category = urlParams.get('category') || '';
            
            // Sync search text on desktop header if present
            if (currentFilters.q && document.getElementById('desktop-search-input')) {
                document.getElementById('desktop-search-input').value = currentFilters.q;
            }

            // Initalise filter sections
            initCategoriesFilter();
            initBrandsFilter();

            // Load products based on initial parameters
            loadFilteredProducts();

            // Mobile filter toggle slide listener
            const filterBtn = document.getElementById('mobile-filter-btn');
            const sidebar = document.getElementById('filter-sidebar');
            if (filterBtn && sidebar) {
                filterBtn.onclick = () => {
                    sidebar.classList.toggle('show');
                };
            }

            // Price range filter listener
            document.getElementById('apply-price-filter-btn').onclick = () => {
                const min = document.getElementById('price-min').value;
                const max = document.getElementById('price-max').value;
                currentFilters.minPrice = min;
                currentFilters.maxPrice = max;
                loadFilteredProducts();
            };

            // Rating radios change listener
            const ratingRadios = document.getElementsByName('rating-filter');
            ratingRadios.forEach(radio => {
                radio.onchange = (e) => {
                    currentFilters.minRating = parseFloat(e.target.value);
                    loadFilteredProducts();
                };
            });

            // Sort dropdown listener
            document.getElementById('sort-selector').onchange = (e) => {
                currentFilters.sort = e.target.value;
                loadFilteredProducts();
            };

            // Reset filters listeners
            document.getElementById('clear-filters-btn').onclick = resetAllFilters;
            document.getElementById('empty-state-reset-btn').onclick = () => {
                window.location.href = 'products.html';
            };
        });

        // Load category links inside filters sidebar
        function initCategoriesFilter() {
            const categories = Products.getCategories();
            const container = document.getElementById('filter-category-list');
            
            let html = `
                <li>
                    <label class="form-checkbox-label">
                        <input type="radio" name="cat-filter" value="" class="form-checkbox" ${currentFilters.category === '' ? 'checked' : ''}>
                        <span>All Categories</span>
                    </label>
                </li>
            `;

            categories.forEach(cat => {
                const isChecked = currentFilters.category === cat.slug || currentFilters.category === String(cat.category_id);
                html += `
                    <li>
                        <label class="form-checkbox-label">
                            <input type="radio" name="cat-filter" value="${cat.slug}" class="form-checkbox" ${isChecked ? 'checked' : ''}>
                            <span>${cat.category_name}</span>
                        </label>
                    </li>
                `;
            });
            container.innerHTML = html;

            // Bind change triggers
            const radios = document.getElementsByName('cat-filter');
            radios.forEach(rad => {
                rad.onchange = (e) => {
                    currentFilters.category = e.target.value;
                    
                    // Update breadcrumb
                    const selectedCat = categories.find(c => c.slug === e.target.value);
                    document.getElementById('breadcrumb-category').innerText = selectedCat ? selectedCat.category_name : 'All Products';
                    
                    loadFilteredProducts();
                };
            });

            // Set initial breadcrumb title
            if (currentFilters.category) {
                const selectedCat = categories.find(c => c.slug === currentFilters.category || String(c.category_id) === currentFilters.category);
                if (selectedCat) {
                    document.getElementById('breadcrumb-category').innerText = selectedCat.category_name;
                }
            }
        }

        // Load Brand options inside filters sidebar
        function initBrandsFilter() {
            const brands = Products.getBrands();
            const container = document.getElementById('filter-brand-list');

            let html = '';
            brands.forEach(br => {
                html += `
                    <li>
                        <label class="form-checkbox-label">
                            <input type="checkbox" name="brand-chk" value="${br.brand_id}" class="form-checkbox">
                            <span>${br.brand_name}</span>
                        </label>
                    </li>
                `;
            });
            container.innerHTML = html;

            // Bind checklist change triggers
            const checkboxes = document.getElementsByName('brand-chk');
            checkboxes.forEach(chk => {
                chk.onchange = () => {
                    const selected = [];
                    checkboxes.forEach(c => {
                        if (c.checked) selected.push(c.value);
                    });
                    currentFilters.brands = selected;
                    loadFilteredProducts();
                };
            });
        }

        // Render matching products grid
        function loadFilteredProducts() {
            const products = Products.getAll(currentFilters);
            const grid = document.getElementById('plp-products-grid');
            const emptyState = document.getElementById('plp-empty-state');
            const countLabel = document.getElementById('results-count');

            countLabel.innerText = `Showing ${products.length} item(s)`;

            if (products.length === 0) {
                grid.style.display = 'none';
                emptyState.classList.remove('d-none');
                return;
            }

            grid.style.display = 'grid';
            emptyState.classList.add('d-none');

            // Find user wishlist items for icons status
            const session = DB.findOne('current_session', {});
            const activeUserId = session ? session.user_id : 'guest';
            const wishlistItems = DB.find('wishlists', { user_id: activeUserId });
            const wishlistProdIds = wishlistItems.map(item => item.product_id);

            let html = '';
            products.forEach(p => {
                const isWishlisted = wishlistProdIds.includes(p.product_id);
                const activePrice = p.primary_variant.discount_price || p.primary_variant.price;
                const originalPrice = p.primary_variant.discount_price ? p.primary_variant.price : null;
                const discountPercent = originalPrice ? Math.round(((originalPrice - activePrice) / originalPrice) * 100) : 0;

                const ratingHtml = p.avg_rating > 0 
                    ? `â­ ${p.avg_rating} <span>(${p.total_reviews})</span>`
                    : '<span style="color:var(--text-muted); font-weight:400;">No reviews</span>';

                html += `
                    <article class="product-card">
                        <div class="product-card-img-container">
                            <a href="product-detail.html?id=${p.product_id}" style="width:100%; height:100%; display:block;">
                                <img src="${p.image_url}" alt="${p.product_name}" class="product-card-img">
                            </a>
                            <button class="product-card-wishlist-btn ${isWishlisted ? 'active' : ''}" 
                                    data-id="${p.product_id}" 
                                    onclick="toggleWishlist(event, ${p.product_id})">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="${isWishlisted ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/></svg>
                            </button>
                        </div>
                        <div class="product-card-body">
                            <div class="product-card-brand">${p.brand_name}</div>
                            <h3 class="product-card-title">
                                <a href="product-detail.html?id=${p.product_id}">${p.product_name}</a>
                            </h3>
                            <div class="product-card-rating">${ratingHtml}</div>
                            <div class="product-card-price-container">
                                <span class="product-card-price">${UI.formatCurrency(activePrice)}</span>
                                ${originalPrice ? `
                                    <span class="product-card-original-price">${UI.formatCurrency(originalPrice)}</span>
                                    <span class="product-card-discount">${discountPercent}% OFF</span>
                                ` : ''}
                            </div>
                        </div>
                    </article>
                `;
            });
            grid.innerHTML = html;
        }

        // Toggle Wishlist handler
        function toggleWishlist(event, productId) {
            event.stopPropagation();
            event.preventDefault();
            
            const btn = event.currentTarget;
            const session = DB.findOne('current_session', {});
            const activeUserId = session ? session.user_id : 'guest';

            const existing = DB.findOne('wishlists', { user_id: activeUserId, product_id: productId });

            if (existing) {
                DB.remove('wishlists', existing.wishlist_id);
                btn.classList.remove('active');
                btn.querySelector('svg').setAttribute('fill', 'none');
                UI.showToast('Item removed from wishlist.', 'info');
            } else {
                DB.insert('wishlists', { user_id: activeUserId, product_id: productId });
                btn.classList.add('active');
                btn.querySelector('svg').setAttribute('fill', 'currentColor');
                UI.showToast('Product added to wishlist!', 'success');
            }
            UI.updateNavBadges();
        }

        // Clear sidebar filter inputs
        function resetAllFilters() {
            currentFilters = {
                q: '',
                category: '',
                brands: [],
                minPrice: '',
                maxPrice: '',
                minRating: 0,
                sort: 'newest'
            };

            // Reset UI controls
            document.getElementById('price-min').value = '';
            document.getElementById('price-max').value = '';
            document.getElementById('sort-selector').value = 'newest';
            document.getElementById('desktop-search-input').value = '';
            
            // Check show all categories radio
            const catRadios = document.getElementsByName('cat-filter');
            catRadios.forEach(rad => rad.checked = rad.value === '');

            // Uncheck all brands
            const brandChks = document.getElementsByName('brand-chk');
            brandChks.forEach(chk => chk.checked = false);

            // Set rating to Show All
            const ratingChks = document.getElementsByName('rating-filter');
            ratingChks.forEach(rad => rad.checked = rad.value === '0');

            document.getElementById('breadcrumb-category').innerText = 'All Products';

            loadFilteredProducts();
        }
    </script>
</body>
</html>
