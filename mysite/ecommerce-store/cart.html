<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - ShopEase</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/responsive.css">
    <style>
        /* Cart layouts */
        .cart-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 24px;
            margin-bottom: 40px;
        }

        @media(min-width: 1025px) {
            .cart-grid {
                grid-template-columns: 1.6fr 0.9fr;
                gap: 32px;
            }
        }

        /* Cart item row styles */
        .cart-item-row {
            display: flex;
            gap: 16px;
            padding: 16px 0;
            border-bottom: 1px solid var(--border);
        }

        .cart-item-row:last-child {
            border-bottom: none;
        }

        .cart-item-img {
            width: 80px;
            height: 80px;
            border-radius: var(--radius-sm);
            background-color: var(--bg-main);
            overflow: hidden;
            flex-shrink: 0;
            border: 1px solid var(--border);
        }

        .cart-item-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .cart-item-info {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        /* Quantity step button groups */
        .quantity-stepper {
            display: flex;
            align-items: center;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            width: fit-content;
            background-color: var(--bg-card);
            overflow: hidden;
        }

        .qty-step-btn {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: 600;
            background-color: var(--bg-main);
            transition: var(--transition);
        }

        .qty-step-btn:hover {
            background-color: var(--border);
        }

        .qty-input {
            width: 38px;
            height: 32px;
            text-align: center;
            border: none;
            border-left: 1px solid var(--border);
            border-right: 1px solid var(--border);
            outline: none;
            font-size: 13px;
            font-weight: 600;
        }

        /* Pricing row block details */
        .price-breakdown-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 14px;
        }

        .grand-total-row {
            border-top: 1px solid var(--border);
            padding-top: 16px;
            margin-top: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 18px;
            font-weight: 700;
        }

        /* Coupon box details */
        .coupon-toggle {
            font-size: 13px;
            font-weight: 600;
            color: var(--primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
        }
    </style>
</head>
<body>

    <!-- Header Injector Placeholder -->
    <div id="header-placeholder"></div>

    <main class="container">
        <h1 class="mb-5">Shopping Cart</h1>

        <!-- Cart grid layout -->
        <div class="cart-grid" id="cart-main-container">
            <!-- 1. Left cart list items -->
            <section class="card" style="padding: 16px 24px;">
                <div class="flex-between mb-4" style="border-bottom: 1px solid var(--border); padding-bottom: 12px;">
                    <h2 style="font-size:16px; font-weight:700;">Cart Items</h2>
                    <button class="btn-link text-danger" style="font-size:13px;" id="clear-all-cart-btn">Clear Cart</button>
                </div>
                <div id="cart-items-list-container">
                    <!-- Dynamic rendering -->
                </div>
            </section>

            <!-- 2. Right breakdown summary panel -->
            <aside>
                <div class="card">
                    <h2 class="card-title" style="font-size:16px; border-bottom: 1px solid var(--border); padding-bottom:12px; margin-bottom:16px;">Order Summary</h2>
                    
                    <!-- Pricing breakdown -->
                    <div id="pricing-breakdown-box">
                        <!-- Dynamic pricing breakdown rows -->
                    </div>

                    <!-- Collapsible Have Coupon Link -->
                    <div class="mb-4" style="border-top: 1px dashed var(--border); padding-top: 16px; margin-top: 16px;">
                        <div class="coupon-toggle" id="coupon-accordion-btn">
                            🏷️ Have a Coupon? 
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg>
                        </div>
                        <div id="coupon-form-drawer" style="display: none; margin-top: 12px;">
                            <div style="display: flex; gap: 8px;">
                                <input type="text" id="coupon-code-input" class="form-control" placeholder="WELCOME100" style="padding: 6px 12px; font-size:13px; text-transform:uppercase;">
                                <button class="btn btn-secondary btn-sm" id="apply-coupon-btn" style="min-height:38px;">Apply</button>
                            </div>
                            <div id="coupon-message" class="mt-2" style="font-size: 12px;"></div>
                        </div>
                    </div>

                    <!-- Proceed Checkout Action buttons -->
                    <button class="btn btn-primary btn-full btn-lg" id="checkout-proceed-btn">
                        Proceed to Checkout
                    </button>
                    
                    <div class="text-center mt-3">
                        <a href="products.html" class="btn-link" style="font-size: 13px;">Continue Shopping</a>
                    </div>
                </div>
            </aside>
        </div>

        <!-- 3. Cart empty states -->
        <div class="empty-state d-none" id="cart-empty-state">
            <span class="empty-state-icon">🛒</span>
            <h3 class="empty-state-title">Your Cart is Empty</h3>
            <p class="empty-state-desc">Looks like you haven't added anything to your cart yet. Explore our top categories now!</p>
            <a href="products.html" class="btn btn-primary btn-lg">Start Shopping</a>
        </div>
    </main>

    <!-- Footer Placeholder -->
    <div id="footer-placeholder"></div>

    <!-- Scripts -->
    <script src="js/db.js"></script>
    <script src="js/seed.js"></script>
    <script src="js/ui-helpers.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/coupons.js"></script>
    <script src="js/main.js"></script>

    <script>
        let appliedCouponCode = null;

        document.addEventListener('DOMContentLoaded', () => {
            renderCartPage();

            // Toggle Coupon drawer click listener
            const couponToggleBtn = document.getElementById('coupon-accordion-btn');
            const couponDrawer = document.getElementById('coupon-form-drawer');
            if (couponToggleBtn && couponDrawer) {
                couponToggleBtn.onclick = () => {
                    const isHidden = couponDrawer.style.display === 'none';
                    couponDrawer.style.display = isHidden ? 'block' : 'none';
                    couponToggleBtn.querySelector('svg').style.transform = isHidden ? 'rotate(180deg)' : 'rotate(0deg)';
                };
            }

            // Apply coupon click listener
            const applyBtn = document.getElementById('apply-coupon-btn');
            const couponInput = document.getElementById('coupon-code-input');
            if (applyBtn && couponInput) {
                applyBtn.onclick = () => {
                    const code = couponInput.value.trim();
                    if (!code) {
                        UI.showToast('Please enter a coupon code.', 'warning');
                        return;
                    }
                    
                    // Trigger dynamic validation
                    appliedCouponCode = code;
                    renderCartPage();
                };
            }

            // Clear Cart items click listener
            const clearCartBtn = document.getElementById('clear-all-cart-btn');
            if (clearCartBtn) {
                clearCartBtn.onclick = () => {
                    UI.showModal({
                        title: 'Clear Shopping Cart?',
                        bodyHTML: '<p>Are you sure you want to remove all items from your cart and release their stock reservations?</p>',
                        primaryText: 'Clear Cart',
                        secondaryText: 'Cancel',
                        onConfirm: () => {
                            Cart.clearCart();
                            appliedCouponCode = null;
                            renderCartPage();
                            UI.showToast('Cart cleared successfully', 'success');
                        }
                    });
                };
            }

            // Proceed Checkout click listener
            const checkoutBtn = document.getElementById('checkout-proceed-btn');
            if (checkoutBtn) {
                checkoutBtn.onclick = () => {
                    const items = Cart.getItems();
                    if (items.length === 0) return;

                    // Ensure user is logged in
                    if (!Auth.isLoggedIn()) {
                        UI.showToast('Please log in to continue checkout.', 'warning');
                        setTimeout(() => {
                            window.location.href = 'login.html?redirect=checkout.html' + 
                                (appliedCouponCode ? encodeURIComponent('?coupon=' + appliedCouponCode) : '');
                        }, 1000);
                        return;
                    }

                    // Redirect to Checkout page passing coupon if any
                    let checkoutUrl = 'checkout.html';
                    if (appliedCouponCode) {
                        checkoutUrl += '?coupon=' + encodeURIComponent(appliedCouponCode);
                    }
                    window.location.href = checkoutUrl;
                };
            }
        });

        // Dynamic cart items and calculations list renderer
        function renderCartPage() {
            const items = Cart.getItems();
            const mainContainer = document.getElementById('cart-main-container');
            const emptyState = document.getElementById('cart-empty-state');

            if (items.length === 0) {
                mainContainer.style.display = 'none';
                emptyState.classList.remove('d-none');
                return;
            }

            mainContainer.style.display = 'grid';
            emptyState.classList.add('d-none');

            // Render list
            const listContainer = document.getElementById('cart-items-list-container');
            let listHtml = '';

            items.forEach(item => {
                const activePrice = item.variant.discount_price || item.variant.price;
                const origPrice = item.variant.discount_price ? item.variant.price : null;
                const rowTotal = activePrice * item.quantity;
                const stockLeft = item.stock ? item.stock.quantity_available - item.stock.quantity_reserved : 0;

                let stockAlert = '';
                if (stockLeft < 0) {
                    stockAlert = `<div style="font-size:11px; color:var(--danger); font-weight:600; margin-top:2px;">⚠️ Exceeds available stock limits! Adjust quantity.</div>`;
                }

                listHtml += `
                    <div class="cart-item-row">
                        <div class="cart-item-img">
                            <img src="${item.image_url}" alt="${item.product ? item.product.product_name : 'Variant'}">
                        </div>
                        <div class="cart-item-info">
                            <h3 style="font-size: 14px; font-weight:600; margin:0;">
                                <a href="product-detail.html?id=${item.product ? item.product.product_id : ''}">${item.product ? item.product.product_name : 'Product'}</a>
                            </h3>
                            <div style="font-size: 12px; color: var(--text-muted);">${item.variant ? item.variant.variant_name : ''}</div>
                            <div style="font-size: 11px; color: var(--text-muted);">Seller: ${item.product ? item.product.seller_name : ''}</div>
                            
                            <div style="display:flex; align-items:center; justify-content:space-between; margin-top:8px; flex-wrap:wrap; gap:8px;">
                                <!-- Quantity adjusters -->
                                <div class="quantity-stepper">
                                    <button class="qty-step-btn" onclick="adjustQty(${item.cart_item_id}, ${item.quantity - 1})">-</button>
                                    <input type="text" class="qty-input" value="${item.quantity}" readonly>
                                    <button class="qty-step-btn" onclick="adjustQty(${item.cart_item_id}, ${item.quantity + 1})">+</button>
                                </div>
                                
                                <!-- Pricing labels -->
                                <div style="text-align: right;">
                                    <div style="font-weight: 700; font-size:15px;">${UI.formatCurrency(rowTotal)}</div>
                                    <div style="font-size:11px; color:var(--text-muted);">${UI.formatCurrency(activePrice)} each</div>
                                </div>
                            </div>
                            ${stockAlert}
                        </div>
                        <button class="text-danger" onclick="deleteCartItem(${item.cart_item_id})" style="font-size: 20px; line-height: 1; align-self: flex-start; padding: 4px;">
                            &times;
                        </button>
                    </div>
                `;
            });
            listContainer.innerHTML = listHtml;

            // Recalculate billing summary
            const breakdown = Cart.getBreakdown(appliedCouponCode);
            const breakdownBox = document.getElementById('pricing-breakdown-box');
            const msgBox = document.getElementById('coupon-message');
            const couponInput = document.getElementById('coupon-code-input');

            // Coupon Message banner alert
            if (appliedCouponCode) {
                if (breakdown.coupon) {
                    msgBox.innerHTML = `<span style="color:var(--success); font-weight:600;">✔️ Coupon "${appliedCouponCode.toUpperCase()}" Applied! Saving ${UI.formatCurrency(breakdown.discount)}.</span>`;
                    couponInput.value = appliedCouponCode.toUpperCase();
                } else {
                    msgBox.innerHTML = `<span style="color:var(--danger); font-weight:600;">❌ Apply failed: ${breakdown.couponError}</span>`;
                    appliedCouponCode = null; // Revert
                }
            } else {
                msgBox.innerHTML = '';
                if (couponInput) couponInput.value = '';
            }

            const checkoutBtn = document.getElementById('checkout-proceed-btn');
            // Disable checkout if stock exceeded
            const hasExceededStock = items.some(item => {
                const stockLeft = item.stock ? item.stock.quantity_available - item.stock.quantity_reserved : 0;
                return stockLeft < 0;
            });

            if (hasExceededStock) {
                checkoutBtn.disabled = true;
                checkoutBtn.innerText = 'Adjust Quantities to Checkout';
            } else {
                checkoutBtn.disabled = false;
                checkoutBtn.innerText = 'Proceed to Checkout';
            }

            let breakdownHtml = `
                <div class="price-breakdown-row">
                    <span class="text-muted">Subtotal (${items.length} items)</span>
                    <span class="font-medium">${UI.formatCurrency(breakdown.subtotal)}</span>
                </div>
            `;

            if (breakdown.discount > 0) {
                breakdownHtml += `
                    <div class="price-breakdown-row" style="color:var(--success); font-weight:550;">
                        <span>Discount Coupon</span>
                        <span>-${UI.formatCurrency(breakdown.discount)}</span>
                    </div>
                `;
            }

            breakdownHtml += `
                <div class="price-breakdown-row">
                    <span class="text-muted">Simulated GST Tax (12%)</span>
                    <span class="font-medium">${UI.formatCurrency(breakdown.tax)}</span>
                </div>
                <div class="price-breakdown-row">
                    <span class="text-muted">Shipping Charges</span>
                    <span class="font-medium">${breakdown.shipping === 0 ? 'FREE' : UI.formatCurrency(breakdown.shipping)}</span>
                </div>
                <div class="grand-total-row">
                    <span>Grand Total</span>
                    <span style="color:var(--primary); font-size:22px;">${UI.formatCurrency(breakdown.total)}</span>
                </div>
            `;

            breakdownBox.innerHTML = breakdownHtml;
        }

        // Adjust quantities click helper
        function adjustQty(cartItemId, newQty) {
            const result = Cart.updateQuantity(cartItemId, newQty);
            if (!result.success) {
                UI.showToast(result.message, 'danger');
            } else {
                renderCartPage();
            }
        }

        // Delete row item helper
        function deleteCartItem(cartItemId) {
            Cart.removeFromCart(cartItemId);
            renderCartPage();
            UI.showToast('Item removed from cart.', 'info');
        }
    </script>
</body>
</html>
