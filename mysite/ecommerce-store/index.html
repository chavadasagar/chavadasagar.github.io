<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%20fill%3D%22none%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22g%22%20x1%3D%220%25%22%20y1%3D%220%25%22%20x2%3D%22100%25%22%20y2%3D%22100%25%22%3E%3Cstop%20offset%3D%220%25%22%20stop-color%3D%22%232563EB%22%2F%3E%3Cstop%20offset%3D%22100%25%22%20stop-color%3D%22%2310B981%22%2F%3E%3C%2FlinearGradient%3E%3C%2Fdefs%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2216%22%20fill%3D%22%2308131d%22%2F%3E%3Crect%20x%3D%222%22%20y%3D%222%22%20width%3D%2260%22%20height%3D%2260%22%20rx%3D%2214%22%20stroke%3D%22url(%23g)%22%20stroke-width%3D%222%22%20stroke-opacity%3D%220.6%22%2F%3E%3Cpath%20d%3D%22M14%2016h6l5%2022h22l4-16H22%22%20stroke%3D%22url(%23g)%22%20stroke-width%3D%222.5%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%20fill%3D%22%230f253a%22%2F%3E%3Ccircle%20cx%3D%2227%22%20cy%3D%2246%22%20r%3D%223.5%22%20fill%3D%22%2310B981%22%2F%3E%3Ccircle%20cx%3D%2243%22%20cy%3D%2246%22%20r%3D%223.5%22%20fill%3D%22%2310B981%22%2F%3E%3C%2Fsvg%3E">
  <link rel="shortcut icon" href="favicon.svg">
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopEase - Simulated E-Commerce Hub</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/responsive.css">
    <style>
        /* Hero Banner Styles */
        .hero-banner {
            background: linear-gradient(135deg, #0f766e 0%, #115e59 100%);
            border-radius: var(--radius-lg);
            padding: 40px 24px;
            color: white;
            position: relative;
            overflow: hidden;
            margin-bottom: 32px;
            box-shadow: var(--shadow-md);
        }
        
        .hero-content {
            max-width: 550px;
            z-index: 2;
            position: relative;
        }

        .hero-title {
            font-size: 28px;
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: 12px;
        }

        .hero-desc {
            font-size: 14px;
            margin-bottom: 24px;
            opacity: 0.9;
        }

        @media(min-width: 640px) {
            .hero-banner { padding: 60px 48px; }
            .hero-title { font-size: 40px; }
            .hero-desc { font-size: 16px; }
        }

        /* Category Items Circular Styles */
        .category-row {
            display: flex;
            gap: 16px;
            overflow-x: auto;
            padding: 8px 4px 16px 4px;
            margin-bottom: 32px;
            scrollbar-width: none; /* Hide scrollbar for clean visual */
        }

        .category-row::-webkit-scrollbar {
            display: none;
        }

        .category-circle-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            min-width: 80px;
            text-align: center;
        }

        .category-circle-img-container {
            width: 64px;
            height: 64px;
            border-radius: var(--radius-full);
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            transition: var(--transition);
            box-shadow: var(--shadow-sm);
        }

        .category-circle-item:hover .category-circle-img-container {
            border-color: var(--primary);
            transform: scale(1.05);
        }

        .category-circle-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .category-circle-label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-main);
            white-space: nowrap;
        }

        /* Section Title Header */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .section-title {
            font-size: 18px;
            font-weight: 700;
        }

        @media(min-width: 640px) {
            .section-title { font-size: 22px; }
        }
    </style>
</head>
<body>

    <!-- Header Injector Placeholder -->
    <div id="header-placeholder"></div>

    <main class="container">
        <!-- 1. Hero Promo Banner Slider -->
        <section class="hero-banner">
            <div class="hero-content">
                <span style="background-color:rgba(255,255,255,0.2); padding:4px 10px; border-radius:var(--radius-sm); font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:1px; margin-bottom:12px; display:inline-block;">Exclusive Launch Offer</span>
                <h1 class="hero-title">Upgrade Your Lifestyle Simulation</h1>
                <p class="hero-desc">Discover the premium gadgets and accessories at discount prices. Use code <strong>WELCOME100</strong> to get flat â‚¹100 discount.</p>
                <a href="products.html" class="btn btn-secondary btn-lg" style="background-color:white; color:var(--primary); font-weight:700;">
                    Start Shopping
                </a>
            </div>
            <!-- Decorative circle backgrounds -->
            <div style="position:absolute; right:-50px; bottom:-50px; width:220px; height:220px; background-color:rgba(255,255,255,0.06); border-radius:50%; pointer-events:none;"></div>
            <div style="position:absolute; right:120px; top:-40px; width:140px; height:140px; background-color:rgba(255,255,255,0.04); border-radius:50%; pointer-events:none;"></div>
        </section>

        <!-- 2. Circular Categories Bar -->
        <section>
            <div class="section-header">
                <h2 class="section-title">Browse Categories</h2>
            </div>
            <div class="category-row" id="categories-circle-row">
                <!-- Dynamically loaded -->
            </div>
        </section>

        <!-- 3. Featured Products Grid -->
        <section class="mb-6">
            <div class="section-header">
                <h2 class="section-title">Featured Products</h2>
                <a href="products.html" class="btn-link" style="font-size:14px; font-weight:600;">View All &rarr;</a>
            </div>
            <div class="product-grid" id="featured-products-grid">
                <!-- Dynamically loaded -->
            </div>
        </section>

        <!-- 4. Best Selling / Hot Deals Grid -->
        <section class="mb-6">
            <div class="section-header">
                <h2 class="section-title">Trending Best Sellers</h2>
                <a href="products.html?sort=rating" class="btn-link" style="font-size:14px; font-weight:600;">View All &rarr;</a>
            </div>
            <div class="product-grid" id="trending-products-grid">
                <!-- Dynamically loaded -->
            </div>
        </section>
    </main>

    <!-- Footer Placeholder -->
    <div id="footer-placeholder"></div>

    <!-- Scripts -->
    <script src="js/db.js"></script>
    <script src="js/seed.js"></script>
    <script src="js/ui-helpers.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/products.js"></script>
    <script src="js/main.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            loadCategories();
            loadFeaturedProducts();
            loadTrendingProducts();
        });

        // 1. Render Categories circle items
        function loadCategories() {
            const categories = Products.getCategories();
            const container = document.getElementById('categories-circle-row');
            
            if (categories.length === 0) {
                container.innerHTML = '<p class="text-muted">No categories seeded.</p>';
                return;
            }

            let html = '';
            categories.forEach(cat => {
                html += `
                    <a href="products.html?category=${cat.slug}" class="category-circle-item">
                        <div class="category-circle-img-container">
                            <img src="${cat.image_url}" alt="${cat.category_name}" class="category-circle-img">
                        </div>
                        <span class="category-circle-label">${cat.category_name}</span>
                    </a>
                `;
            });
            container.innerHTML = html;
        }

        // 2. Render Featured products (first 4 items)
        function loadFeaturedProducts() {
            const products = Products.getAll();
            const container = document.getElementById('featured-products-grid');
            
            if (products.length === 0) {
                container.innerHTML = '<p class="text-muted text-center" style="grid-column: 1/-1;">No products available.</p>';
                return;
            }

            // Slice first 4 products
            const featuredList = products.slice(0, 4);
            renderProductGrid(featuredList, container);
        }

        // 3. Render Trending products (highest rating)
        function loadTrendingProducts() {
            const products = Products.getAll({ sort: 'rating' });
            const container = document.getElementById('trending-products-grid');

            if (products.length === 0) {
                container.innerHTML = '<p class="text-muted text-center" style="grid-column: 1/-1;">No products available.</p>';
                return;
            }

            // Slice first 4 products
            const trendingList = products.slice(0, 4);
            renderProductGrid(trendingList, container);
        }

        // Universal Grid renderer helper
        function renderProductGrid(list, container) {
            const session = DB.findOne('current_session', {});
            const activeUserId = session ? session.user_id : 'guest';
            const wishlistItems = DB.find('wishlists', { user_id: activeUserId });
            const wishlistProdIds = wishlistItems.map(item => item.product_id);

            let html = '';
            list.forEach(p => {
                const isWishlisted = wishlistProdIds.includes(p.product_id);
                const activePrice = p.primary_variant.discount_price || p.primary_variant.price;
                const originalPrice = p.primary_variant.discount_price ? p.primary_variant.price : null;
                const discountPercent = originalPrice ? Math.round(((originalPrice - activePrice) / originalPrice) * 100) : 0;

                const ratingHtml = p.avg_rating > 0 
                    ? `â­ ${p.avg_rating} <span>(${p.total_reviews})</span>`
                    : '<span style="color:var(--text-muted); font-weight:400;">No reviews</span>';

                html += `
                    <article class="product-card">
                        <div class="product-card-img-container">
                            <a href="product-detail.html?id=${p.product_id}" style="width:100%; height:100%; display:block;">
                                <img src="${p.image_url}" alt="${p.product_name}" class="product-card-img">
                            </a>
                            <button class="product-card-wishlist-btn ${isWishlisted ? 'active' : ''}" 
                                    data-id="${p.product_id}" 
                                    onclick="toggleWishlist(event, ${p.product_id})">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="${isWishlisted ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/></svg>
                            </button>
                        </div>
                        <div class="product-card-body">
                            <div class="product-card-brand">${p.brand_name}</div>
                            <h3 class="product-card-title">
                                <a href="product-detail.html?id=${p.product_id}">${p.product_name}</a>
                            </h3>
                            <div class="product-card-rating">${ratingHtml}</div>
                            <div class="product-card-price-container">
                                <span class="product-card-price">${UI.formatCurrency(activePrice)}</span>
                                ${originalPrice ? `
                                    <span class="product-card-original-price">${UI.formatCurrency(originalPrice)}</span>
                                    <span class="product-card-discount">${discountPercent}% OFF</span>
                                ` : ''}
                            </div>
                        </div>
                    </article>
                `;
            });
            container.innerHTML = html;
        }

        // Toggle Wishlist Add/Remove handler
        function toggleWishlist(event, productId) {
            event.stopPropagation();
            event.preventDefault();
            
            const btn = event.currentTarget;
            const session = DB.findOne('current_session', {});
            const activeUserId = session ? session.user_id : 'guest';

            const existing = DB.findOne('wishlists', { user_id: activeUserId, product_id: productId });

            if (existing) {
                DB.remove('wishlists', existing.wishlist_id);
                btn.classList.remove('active');
                btn.querySelector('svg').setAttribute('fill', 'none');
                UI.showToast('Item removed from wishlist.', 'info');
            } else {
                DB.insert('wishlists', { user_id: activeUserId, product_id: productId });
                btn.classList.add('active');
                btn.querySelector('svg').setAttribute('fill', 'currentColor');
                UI.showToast('Product added to wishlist!', 'success');
            }
            UI.updateNavBadges();
        }
    </script>
</body>
</html>
