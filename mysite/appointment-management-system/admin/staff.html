<html lang="en">
<head>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%20fill%3D%22none%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22g%22%20x1%3D%220%25%22%20y1%3D%220%25%22%20x2%3D%22100%25%22%20y2%3D%22100%25%22%3E%3Cstop%20offset%3D%220%25%22%20stop-color%3D%22%23059669%22%2F%3E%3Cstop%20offset%3D%22100%25%22%20stop-color%3D%22%230284C7%22%2F%3E%3C%2FlinearGradient%3E%3C%2Fdefs%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2216%22%20fill%3D%22%2307171c%22%2F%3E%3Crect%20x%3D%222%22%20y%3D%222%22%20width%3D%2260%22%20height%3D%2260%22%20rx%3D%2214%22%20stroke%3D%22url(%23g)%22%20stroke-width%3D%222%22%20stroke-opacity%3D%220.6%22%2F%3E%3Crect%20x%3D%2214%22%20y%3D%2216%22%20width%3D%2236%22%20height%3D%2234%22%20rx%3D%224%22%20stroke%3D%22url(%23g)%22%20stroke-width%3D%222.5%22%20fill%3D%22%230c262e%22%2F%3E%3Cpath%20d%3D%22M14%2026h36M22%2012v6M42%2012v6%22%20stroke%3D%22url(%23g)%22%20stroke-width%3D%222.5%22%20stroke-linecap%3D%22round%22%2F%3E%3Cpath%20d%3D%22M24%2038l6%206%2012-12%22%20stroke%3D%22%23059669%22%20stroke-width%3D%223%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%2F%3E%3C%2Fsvg%3E">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Staff - ClinicSys</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <div class="app-container">
    <!-- Sidebar injected here -->

    <main class="main-content">
      <header style="margin-bottom: var(--spacing-lg); display: flex; justify-content: space-between; align-items: center;">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%20fill%3D%22none%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22g%22%20x1%3D%220%25%22%20y1%3D%220%25%22%20x2%3D%22100%25%22%20y2%3D%22100%25%22%3E%3Cstop%20offset%3D%220%25%22%20stop-color%3D%22%23059669%22%2F%3E%3Cstop%20offset%3D%22100%25%22%20stop-color%3D%22%230284C7%22%2F%3E%3C%2FlinearGradient%3E%3C%2Fdefs%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2216%22%20fill%3D%22%2307171c%22%2F%3E%3Crect%20x%3D%222%22%20y%3D%222%22%20width%3D%2260%22%20height%3D%2260%22%20rx%3D%2214%22%20stroke%3D%22url(%23g)%22%20stroke-width%3D%222%22%20stroke-opacity%3D%220.6%22%2F%3E%3Crect%20x%3D%2214%22%20y%3D%2216%22%20width%3D%2236%22%20height%3D%2234%22%20rx%3D%224%22%20stroke%3D%22url(%23g)%22%20stroke-width%3D%222.5%22%20fill%3D%22%230c262e%22%2F%3E%3Cpath%20d%3D%22M14%2026h36M22%2012v6M42%2012v6%22%20stroke%3D%22url(%23g)%22%20stroke-width%3D%222.5%22%20stroke-linecap%3D%22round%22%2F%3E%3Cpath%20d%3D%22M24%2038l6%206%2012-12%22%20stroke%3D%22%23059669%22%20stroke-width%3D%223%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%2F%3E%3C%2Fsvg%3E">
  <link rel="shortcut icon" href="favicon.svg">
  <div>
          <h2>Manage Reception Staff</h2>
          <p style="color: var(--neutral-400); font-size: 14px;">Register and manage clinic receptionist accounts for front-desk operations.</p>
        </div>
        <button class="btn btn-primary" id="btn-add-staff">ðŸ‘¥ Add Receptionist</button>
      </header>

      <!-- Staff List Card -->
      <section class="card">
        <div class="table-container">
          <table class="table">
            <thead>
              <tr>
                <th>Account ID</th>
                <th>Email Address</th>
                <th>Role</th>
                <th>Temp Password</th>
                <th style="text-align: right;">Action</th>
              </tr>
            </thead>
            <tbody id="staff-rows">
              <!-- Loaded dynamically -->
            </tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <script src="../js/db.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/toast.js"></script>
  <script src="../js/modal.js"></script>
  <script src="../js/navbar.js"></script>
  <script>
    // Role Guard
    if (window.AUTH) {
      window.AUTH.checkRole(['ClinicAdmin']);
    }

    document.addEventListener('DOMContentLoaded', () => {
      const staffRows = document.getElementById('staff-rows');
      const btnAddStaff = document.getElementById('btn-add-staff');

      const renderStaff = () => {
        staffRows.innerHTML = '';
        if (!window.DB) return;

        const users = window.DB.get(window.DB_COLLECTIONS.USERS);
        // Receptionists
        const staff = users.filter(u => u.role === 'Receptionist');

        if (staff.length === 0) {
          staffRows.innerHTML = `
            <tr>
              <td colspan="5" style="text-align: center; color: var(--neutral-400); padding: 24px 0;">No receptionist accounts created yet.</td>
            </tr>
          `;
          return;
        }

        staff.forEach(member => {
          const row = document.createElement('tr');
          row.innerHTML = `
            <td><code>${member.id}</code></td>
            <td><strong>${member.email}</strong></td>
            <td><span class="badge badge-inprogress">${member.role}</span></td>
            <td><code>${member.password}</code></td>
            <td style="text-align: right;">
              <button class="btn btn-danger btn-xs" onclick="removeStaff('${member.id}')">Delete</button>
            </td>
          `;
          staffRows.appendChild(row);
        });
      };

      // Remove Staff account
      window.removeStaff = (userId) => {
        // Prevent deleting the preseeded demo receptionist
        const users = window.DB.get(window.DB_COLLECTIONS.USERS);
        const user = users.find(u => u.id === userId);
        
        if (user && user.email === 'reception@demo.com') {
          window.Toast.show("Cannot delete the preseeded demo receptionist account.", "error");
          return;
        }

        window.Modal.confirm({
          title: "Delete Staff Account?",
          body: `Are you sure you want to delete receptionist account <strong>${user ? user.email : ''}</strong>? This user will lose access to the system immediately.`,
          confirmText: "Delete Account",
          onConfirm: () => {
            const deleted = window.DB.delete(window.DB_COLLECTIONS.USERS, userId);
            if (deleted) {
              window.Toast.show("Staff account deleted successfully.", "success");
              renderStaff();
            } else {
              window.Toast.show("Failed to delete account.", "error");
            }
          }
        });
      };

      // Add Staff Modal prompt
      btnAddStaff.onclick = () => {
        window.Modal.prompt({
          title: "ðŸ‘¥ Add Receptionist Account",
          bodyHtml: `
            <div class="form-group">
              <label class="form-label">Email Address</label>
              <input class="form-control" type="email" name="email" required placeholder="receptionist@clinic.com">
            </div>
            <div class="form-group">
              <label class="form-label">Password</label>
              <input class="form-control" type="password" name="password" required value="Demo@123" placeholder="Set temporary password...">
            </div>
          `,
          confirmText: "Create Account",
          onConfirm: (formData) => {
            const email = formData.email.trim().toLowerCase();
            const password = formData.password.trim();

            if (!email || !password) {
              window.Toast.show("Please enter email and password.", "error");
              return false;
            }

            const users = window.DB.get(window.DB_COLLECTIONS.USERS);
            if (users.some(u => u.email.toLowerCase() === email)) {
              window.Toast.show("This email is already in use by another account.", "error");
              return false;
            }

            // Create Receptionist User
            window.DB.insert(window.DB_COLLECTIONS.USERS, {
              email,
              password,
              role: 'Receptionist',
              linkedId: null
            });

            window.Toast.show("Receptionist account created successfully!", "success");
            renderStaff();
          }
        });
      };

      renderStaff();
    });
  </script>
</body>
</html>
