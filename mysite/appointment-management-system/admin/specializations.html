<html lang="en">
<head>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%20fill%3D%22none%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22g%22%20x1%3D%220%25%22%20y1%3D%220%25%22%20x2%3D%22100%25%22%20y2%3D%22100%25%22%3E%3Cstop%20offset%3D%220%25%22%20stop-color%3D%22%23059669%22%2F%3E%3Cstop%20offset%3D%22100%25%22%20stop-color%3D%22%230284C7%22%2F%3E%3C%2FlinearGradient%3E%3C%2Fdefs%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2216%22%20fill%3D%22%2307171c%22%2F%3E%3Crect%20x%3D%222%22%20y%3D%222%22%20width%3D%2260%22%20height%3D%2260%22%20rx%3D%2214%22%20stroke%3D%22url(%23g)%22%20stroke-width%3D%222%22%20stroke-opacity%3D%220.6%22%2F%3E%3Crect%20x%3D%2214%22%20y%3D%2216%22%20width%3D%2236%22%20height%3D%2234%22%20rx%3D%224%22%20stroke%3D%22url(%23g)%22%20stroke-width%3D%222.5%22%20fill%3D%22%230c262e%22%2F%3E%3Cpath%20d%3D%22M14%2026h36M22%2012v6M42%2012v6%22%20stroke%3D%22url(%23g)%22%20stroke-width%3D%222.5%22%20stroke-linecap%3D%22round%22%2F%3E%3Cpath%20d%3D%22M24%2038l6%206%2012-12%22%20stroke%3D%22%23059669%22%20stroke-width%3D%223%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%2F%3E%3C%2Fsvg%3E">
  <link rel="shortcut icon" href="favicon.svg">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Specializations - ClinicSys</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <div class="app-container">
    <!-- Sidebar injected here -->

    <main class="main-content">
      <header style="margin-bottom: var(--spacing-lg); display: flex; justify-content: space-between; align-items: center;">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%20fill%3D%22none%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22g%22%20x1%3D%220%25%22%20y1%3D%220%25%22%20x2%3D%22100%25%22%20y2%3D%22100%25%22%3E%3Cstop%20offset%3D%220%25%22%20stop-color%3D%22%23059669%22%2F%3E%3Cstop%20offset%3D%22100%25%22%20stop-color%3D%22%230284C7%22%2F%3E%3C%2FlinearGradient%3E%3C%2Fdefs%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2216%22%20fill%3D%22%2307171c%22%2F%3E%3Crect%20x%3D%222%22%20y%3D%222%22%20width%3D%2260%22%20height%3D%2260%22%20rx%3D%2214%22%20stroke%3D%22url(%23g)%22%20stroke-width%3D%222%22%20stroke-opacity%3D%220.6%22%2F%3E%3Crect%20x%3D%2214%22%20y%3D%2216%22%20width%3D%2236%22%20height%3D%2234%22%20rx%3D%224%22%20stroke%3D%22url(%23g)%22%20stroke-width%3D%222.5%22%20fill%3D%22%230c262e%22%2F%3E%3Cpath%20d%3D%22M14%2026h36M22%2012v6M42%2012v6%22%20stroke%3D%22url(%23g)%22%20stroke-width%3D%222.5%22%20stroke-linecap%3D%22round%22%2F%3E%3Cpath%20d%3D%22M24%2038l6%206%2012-12%22%20stroke%3D%22%23059669%22%20stroke-width%3D%223%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%2F%3E%3C%2Fsvg%3E">
  <link rel="shortcut icon" href="favicon.svg">
  <div>
          <h2>Manage Specializations</h2>
          <p style="color: var(--neutral-400); font-size: 14px;">Define, edit, and delete medical specialization tags offered in the clinic.</p>
        </div>
        <button class="btn btn-primary" id="btn-add-spec">ðŸ·ï¸ Add Specialization</button>
      </header>

      <!-- Specializations List Card -->
      <section class="card">
        <div class="table-container">
          <table class="table">
            <thead>
              <tr>
                <th>Specialization Name</th>
                <th>Description</th>
                <th>Assigned Doctors</th>
                <th style="text-align: right;">Actions</th>
              </tr>
            </thead>
            <tbody id="spec-rows">
              <!-- Loaded dynamically -->
            </tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <script src="../js/db.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/toast.js"></script>
  <script src="../js/modal.js"></script>
  <script src="../js/navbar.js"></script>
  <script>
    // Role Guard
    if (window.AUTH) {
      window.AUTH.checkRole(['ClinicAdmin']);
    }

    document.addEventListener('DOMContentLoaded', () => {
      const specRows = document.getElementById('spec-rows');
      const btnAddSpec = document.getElementById('btn-add-spec');

      const renderSpecs = () => {
        specRows.innerHTML = '';
        if (!window.DB) return;

        const specializations = window.DB.get(window.DB_COLLECTIONS.SPECIALIZATIONS);
        const doctors = window.DB.get(window.DB_COLLECTIONS.DOCTORS);

        if (specializations.length === 0) {
          specRows.innerHTML = `
            <tr>
              <td colspan="4" style="text-align: center; color: var(--neutral-400); padding: 24px 0;">No specializations defined.</td>
            </tr>
          `;
          return;
        }

        specializations.forEach(spec => {
          const docCount = doctors.filter(d => d.specializationId === spec.id).length;
          const row = document.createElement('tr');
          
          row.innerHTML = `
            <td><strong>${spec.name}</strong></td>
            <td style="font-size: 13px; color: var(--neutral-600);">${spec.description || 'No description provided.'}</td>
            <td><span class="badge badge-completed" style="font-size: 11px;">${docCount} Doctors</span></td>
            <td style="text-align: right;">
              <button class="btn btn-secondary btn-xs" onclick="editSpec('${spec.id}')">âœï¸ Edit</button>
              <button class="btn btn-danger btn-xs" onclick="deleteSpec('${spec.id}', ${docCount})">Delete</button>
            </td>
          `;
          specRows.appendChild(row);
        });
      };

      // Add Specialization
      btnAddSpec.onclick = () => {
        window.Modal.prompt({
          title: "ðŸ·ï¸ Add Specialization",
          bodyHtml: `
            <div class="form-group">
              <label class="form-label">Name</label>
              <input class="form-control" type="text" name="name" required placeholder="e.g. Dermatology">
            </div>
            <div class="form-group">
              <label class="form-label">Description</label>
              <textarea class="form-control" name="description" rows="3" required placeholder="Description of medical coverage..."></textarea>
            </div>
          `,
          confirmText: "Create Specialization",
          onConfirm: (formData) => {
            const name = formData.name.trim();
            const description = formData.description.trim();

            if (!name || !description) {
              window.Toast.show("Please enter name and description.", "error");
              return false;
            }

            const id = 'spec-' + name.toLowerCase().substring(0, 5).replace(/\s+/g, '');
            window.DB.insert(window.DB_COLLECTIONS.SPECIALIZATIONS, {
              id,
              name,
              description
            });

            window.Toast.show("Specialization added successfully!", "success");
            renderSpecs();
          }
        });
      };

      // Edit Specialization
      window.editSpec = (id) => {
        const spec = window.DB.getById(window.DB_COLLECTIONS.SPECIALIZATIONS, id);
        if (!spec) return;

        window.Modal.prompt({
          title: `âœï¸ Edit Specialization: ${spec.name}`,
          bodyHtml: `
            <div class="form-group">
              <label class="form-label">Name</label>
              <input class="form-control" type="text" name="name" required value="${spec.name}">
            </div>
            <div class="form-group">
              <label class="form-label">Description</label>
              <textarea class="form-control" name="description" rows="3" required>${spec.description}</textarea>
            </div>
          `,
          confirmText: "Update",
          onConfirm: (formData) => {
            const name = formData.name.trim();
            const description = formData.description.trim();

            if (!name || !description) return false;

            window.DB.update(window.DB_COLLECTIONS.SPECIALIZATIONS, id, {
              name,
              description
            });

            window.Toast.show("Specialization updated successfully.", "success");
            renderSpecs();
          }
        });
      };

      // Delete Specialization (prevent if docCount > 0)
      window.deleteSpec = (id, docCount) => {
        if (docCount > 0) {
          window.Toast.show(`Cannot delete: ${docCount} doctor(s) are assigned to this specialization. Reassign them first.`, "error");
          return;
        }

        const spec = window.DB.getById(window.DB_COLLECTIONS.SPECIALIZATIONS, id);

        window.Modal.confirm({
          title: "Delete Specialization?",
          body: `Are you sure you want to delete specialization <strong>${spec ? spec.name : ''}</strong>? This action cannot be undone.`,
          confirmText: "Delete",
          onConfirm: () => {
            const deleted = window.DB.delete(window.DB_COLLECTIONS.SPECIALIZATIONS, id);
            if (deleted) {
              window.Toast.show("Specialization deleted successfully.", "success");
              renderSpecs();
            } else {
              window.Toast.show("Failed to delete.", "error");
            }
          }
        });
      };

      renderSpecs();
    });
  </script>
</body>
</html>
