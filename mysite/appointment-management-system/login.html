<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%20fill%3D%22none%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22g%22%20x1%3D%220%25%22%20y1%3D%220%25%22%20x2%3D%22100%25%22%20y2%3D%22100%25%22%3E%3Cstop%20offset%3D%220%25%22%20stop-color%3D%22%23059669%22%2F%3E%3Cstop%20offset%3D%22100%25%22%20stop-color%3D%22%230284C7%22%2F%3E%3C%2FlinearGradient%3E%3C%2Fdefs%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2216%22%20fill%3D%22%2307171c%22%2F%3E%3Crect%20x%3D%222%22%20y%3D%222%22%20width%3D%2260%22%20height%3D%2260%22%20rx%3D%2214%22%20stroke%3D%22url(%23g)%22%20stroke-width%3D%222%22%20stroke-opacity%3D%220.6%22%2F%3E%3Crect%20x%3D%2214%22%20y%3D%2216%22%20width%3D%2236%22%20height%3D%2234%22%20rx%3D%224%22%20stroke%3D%22url(%23g)%22%20stroke-width%3D%222.5%22%20fill%3D%22%230c262e%22%2F%3E%3Cpath%20d%3D%22M14%2026h36M22%2012v6M42%2012v6%22%20stroke%3D%22url(%23g)%22%20stroke-width%3D%222.5%22%20stroke-linecap%3D%22round%22%2F%3E%3Cpath%20d%3D%22M24%2038l6%206%2012-12%22%20stroke%3D%22%23059669%22%20stroke-width%3D%223%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%2F%3E%3C%2Fsvg%3E">
  <link rel="shortcut icon" href="favicon.svg">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - ClinicSys</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .login-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--spacing-md);
      background: radial-gradient(circle at 10% 20%, rgb(242, 246, 248) 0%, rgb(224, 238, 241) 90.1%);
    }
    .login-card {
      width: 100%;
      max-width: 440px;
      background: white;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      padding: var(--spacing-xl);
      border: 1px solid var(--neutral-200);
    }
    .login-header {
      text-align: center;
      margin-bottom: var(--spacing-lg);
    }
    .login-brand {
      font-size: 28px;
      font-weight: 700;
      color: var(--neutral-900);
      margin-bottom: var(--spacing-xs);
    }
    .login-brand span {
      color: var(--primary);
    }
    .login-subtitle {
      font-size: 14px;
      color: var(--neutral-400);
    }
    .presets-container {
      background-color: var(--neutral-50);
      border: 1px solid var(--neutral-200);
      border-radius: var(--radius-md);
      padding: var(--spacing-sm) var(--spacing-md);
      margin-bottom: var(--spacing-lg);
    }
    .presets-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--neutral-600);
      margin-bottom: var(--spacing-xs);
      text-align: center;
    }
    .presets-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
    }
    .preset-btn {
      padding: 6px;
      font-size: 11px;
      text-align: center;
      border: 1px solid var(--neutral-300);
      background: white;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s;
    }
    .preset-btn:hover {
      border-color: var(--primary);
      background-color: var(--primary-light);
      color: var(--primary);
    }
  </style>
</head>
<body class="login-container">

  <div class="login-card">
    <div class="login-header">
      <div class="login-brand">ðŸ©º <span>Clinic</span>Sys</div>
      <p class="login-subtitle">Sign in to manage your medical appointments</p>
    </div>

    <!-- Quick Presets -->
    <div class="presets-container">
      <div class="presets-title">âš¡ QUICK DEMO LOGINS</div>
      <div class="presets-grid">
        <button class="preset-btn" data-email="patient@demo.com" data-role="Patient">Patient</button>
        <button class="preset-btn" data-email="doctor@demo.com" data-role="Doctor">Doctor</button>
        <button class="preset-btn" data-email="reception@demo.com" data-role="Receptionist">Receptionist</button>
        <button class="preset-btn" data-email="admin@demo.com" data-role="ClinicAdmin">Clinic Admin</button>
      </div>
    </div>

    <!-- Login Form -->
    <form id="login-form">
      <div class="form-group">
        <label class="form-label" for="email">Email Address</label>
        <input class="form-control" type="email" id="email" required placeholder="name@example.com">
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input class="form-control" type="password" id="password" required placeholder="â€¢â€¢â€¢â€¢â€¢â€¢â€¢â€¢">
      </div>

      <button class="btn btn-primary" type="submit" style="width: 100%; margin-top: var(--spacing-sm);">Sign In</button>
    </form>

    <div style="text-align: center; margin-top: var(--spacing-lg); font-size: 13px; color: var(--neutral-600);">
      Don't have a patient account? <a href="register.html" style="font-weight: 600;">Register Here</a>
    </div>
  </div>

  <script src="js/db.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/modal.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const loginForm = document.getElementById('login-form');
      const emailInput = document.getElementById('email');
      const passwordInput = document.getElementById('password');
      const presetButtons = document.querySelectorAll('.preset-btn');

      // Wire up quick presets
      presetButtons.forEach(btn => {
        btn.addEventListener('click', () => {
          const email = btn.getAttribute('data-email');
          emailInput.value = email;
          passwordInput.value = 'Demo@123';
          window.Toast.show(`Autofilled ${btn.getAttribute('data-role')} credentials!`, "info");
        });
      });

      // Handle login form submission
      loginForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const email = emailInput.value.trim();
        const password = passwordInput.value;

        const result = window.AUTH.login(email, password);
        if (result.success) {
          window.Toast.show(`Welcome back, ${result.user.role}!`, "success");
          
          // Check for redirect URL
          const params = new URLSearchParams(window.location.search);
          const returnUrl = params.get('returnUrl');
          
          setTimeout(() => {
            if (returnUrl) {
              window.location.href = decodeURIComponent(returnUrl);
            } else {
              window.AUTH.redirectToDashboard(result.user.role);
            }
          }, 800);
        } else {
          window.Toast.show(result.error, "error");
        }
      });
    });
  </script>
</body>
</html>
