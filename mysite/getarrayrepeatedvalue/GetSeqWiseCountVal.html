<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Sequence Wise Count - Array Repeated Value</title>
    <meta name="description" content="Calculate consecutive sequential counts in an array or string." />
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body>
    <div class="app-wrapper">
      <header class="header">
        <h1>Array Value Analyzer</h1>
        <p>Analyze frequency & sequential occurrences of characters or array values</p>
      </header>

      <nav class="nav-tabs" aria-label="Mode Navigation">
        <a href="index.html" class="nav-tab">Frequency Count</a>
        <a href="GetSeqWiseCountVal.html" class="nav-tab active">Sequence-wise Count</a>
      </nav>

      <main class="card">
        <div class="form-group">
          <div class="form-label">
            <label for="UserString">Enter String / Array Items</label>
            <span>Type or paste below</span>
          </div>
          <textarea 
            id="UserString" 
            placeholder="e.g. aaabbcdddd or 112233"
            spellcheck="false"
          ></textarea>

          <div class="quick-samples">
            <span class="sample-title">Try sample:</span>
            <button class="chip" data-val="aaabbbccc">aaabbbccc</button>
            <button class="chip" data-val="aabbaa">aabbaa</button>
            <button class="chip" data-val="1112233311">1112233311</button>
          </div>
        </div>

        <div class="action-row">
          <button type="button" id="sq_check_btn" class="btn btn-primary">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
            Count Sequence Values
          </button>
          <button type="button" id="clear_btn" class="btn btn-secondary">Clear</button>
        </div>

        <section class="output-section">
          <div class="output">
            <div class="empty-state">
              Enter text above and press "Count Sequence Values" to view results.
            </div>
          </div>
        </section>
      </main>
    </div>

    <script src="assets/js/script.js"></script>
  </body>
</html>
