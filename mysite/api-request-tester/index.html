<!DOCTYPE html>
<html lang="en">
  <head>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%20fill%3D%22none%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22g%22%20x1%3D%220%25%22%20y1%3D%220%25%22%20x2%3D%22100%25%22%20y2%3D%22100%25%22%3E%3Cstop%20offset%3D%220%25%22%20stop-color%3D%22%238B5CF6%22%2F%3E%3Cstop%20offset%3D%22100%25%22%20stop-color%3D%22%2306B6D4%22%2F%3E%3C%2FlinearGradient%3E%3C%2Fdefs%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2216%22%20fill%3D%22%23100d20%22%2F%3E%3Crect%20x%3D%222%22%20y%3D%222%22%20width%3D%2260%22%20height%3D%2260%22%20rx%3D%2214%22%20stroke%3D%22url(%23g)%22%20stroke-width%3D%222%22%20stroke-opacity%3D%220.6%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2216%22%20width%3D%2240%22%20height%3D%2232%22%20rx%3D%225%22%20stroke%3D%22url(%23g)%22%20stroke-width%3D%222.5%22%20fill%3D%22%231d163a%22%2F%3E%3Cpath%20d%3D%22M18%2026l6%206-6%206M28%2038h10%22%20stroke%3D%22%2306B6D4%22%20stroke-width%3D%222.5%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%2F%3E%3Cpolygon%20points%3D%2244%2022%2038%2031%2043%2031%2040%2038%2048%2029%2043%2029%22%20fill%3D%22%238B5CF6%22%2F%3E%3C%2Fsvg%3E">
  <link rel="shortcut icon" href="favicon.svg">
  <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="Modern Mobile-Friendly Web Postman API Client Tool" />
    <title>Postman Web Studio - API Testing Client</title>

    <!-- Bootstrap CSS -->
    <link href="assets/bootstrap/css/bootstrap.min.css" rel="stylesheet" />
    <!-- Custom CSS -->
    <link href="assets/css/style.css" rel="stylesheet" />
  </head>
  <body>
    <div class="app-container">
      <!-- App Header -->
      <header class="app-header">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%20fill%3D%22none%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22g%22%20x1%3D%220%25%22%20y1%3D%220%25%22%20x2%3D%22100%25%22%20y2%3D%22100%25%22%3E%3Cstop%20offset%3D%220%25%22%20stop-color%3D%22%238B5CF6%22%2F%3E%3Cstop%20offset%3D%22100%25%22%20stop-color%3D%22%2306B6D4%22%2F%3E%3C%2FlinearGradient%3E%3C%2Fdefs%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2216%22%20fill%3D%22%23100d20%22%2F%3E%3Crect%20x%3D%222%22%20y%3D%222%22%20width%3D%2260%22%20height%3D%2260%22%20rx%3D%2214%22%20stroke%3D%22url(%23g)%22%20stroke-width%3D%222%22%20stroke-opacity%3D%220.6%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2216%22%20width%3D%2240%22%20height%3D%2232%22%20rx%3D%225%22%20stroke%3D%22url(%23g)%22%20stroke-width%3D%222.5%22%20fill%3D%22%231d163a%22%2F%3E%3Cpath%20d%3D%22M18%2026l6%206-6%206M28%2038h10%22%20stroke%3D%22%2306B6D4%22%20stroke-width%3D%222.5%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%2F%3E%3Cpolygon%20points%3D%2244%2022%2038%2031%2043%2031%2040%2038%2048%2029%2043%2029%22%20fill%3D%22%238B5CF6%22%2F%3E%3C%2Fsvg%3E">
  <link rel="shortcut icon" href="favicon.svg">
  <div class="brand-logo">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
          </svg>
          <h1 class="brand-title">Postman Web</h1>
        </div>
        <div class="d-flex gap-2">
          <button class="btn btn-outline-light btn-sm d-flex align-items-center gap-1" id="presetBtn">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
            <span class="d-none d-sm-inline">Sample Request</span>
          </button>
          <button class="btn btn-outline-warning btn-sm d-flex align-items-center gap-1" data-bs-toggle="offcanvas" data-bs-target="#historyOffcanvas">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span>History</span>
          </button>
        </div>
      </header>

      <!-- Main Request Form -->
      <form id="postmanform">
        <div class="custom-card">
          <!-- Request Bar -->
          <div class="input-group url-input-group mb-3">
            <select class="form-select method-select method-get" id="requestMethod" name="requesttype">
              <option value="GET" class="method-get" selected>GET</option>
              <option value="POST" class="method-post">POST</option>
              <option value="PUT" class="method-put">PUT</option>
              <option value="DELETE" class="method-delete">DELETE</option>
              <option value="PATCH" class="method-patch">PATCH</option>
            </select>
            <input
              type="text"
              class="form-control url-input"
              id="requestUrl"
              name="url"
              placeholder="https://jsonplaceholder.typicode.com/posts/1"
              required
            />
            <button class="btn btn-send" type="submit" id="btnSend">
              <span id="btnSendText">Send</span>
              <span id="btnSendSpinner" class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
            </button>
          </div>

          <!-- Configuration Tabs -->
          <ul class="nav nav-tabs custom-nav-tabs" id="requestTabs" role="tablist">
            <li class="nav-item" role="presentation">
              <button class="nav-link active" id="params-tab" data-bs-toggle="tab" data-bs-target="#params-pane" type="button" role="tab">Params</button>
            </li>
            <li class="nav-item" role="presentation">
              <button class="nav-link" id="headers-tab" data-bs-toggle="tab" data-bs-target="#headers-pane" type="button" role="tab">Headers</button>
            </li>
            <li class="nav-item" role="presentation">
              <button class="nav-link" id="body-tab" data-bs-toggle="tab" data-bs-target="#body-pane" type="button" role="tab">Body</button>
            </li>
            <li class="nav-item" role="presentation">
              <button class="nav-link" id="auth-tab" data-bs-toggle="tab" data-bs-target="#auth-pane" type="button" role="tab">Auth</button>
            </li>
          </ul>

          <div class="tab-content pt-3" id="requestTabsContent">
            <!-- Params Pane -->
            <div class="tab-pane fade show active" id="params-pane" role="tabpanel">
              <div class="d-flex justify-content-between align-items-center mb-2">
                <small class="text-muted">Query Parameters</small>
                <button type="button" class="btn btn-sm btn-outline-primary" id="btnAddParam">+ Add Param</button>
              </div>
              <div id="queryParamsContainer">
                <!-- Dynamic Param rows will be rendered here -->
              </div>
            </div>

            <!-- Headers Pane -->
            <div class="tab-pane fade" id="headers-pane" role="tabpanel">
              <div class="d-flex justify-content-between align-items-center mb-2">
                <small class="text-muted">HTTP Request Headers</small>
                <button type="button" class="btn btn-sm btn-outline-primary" id="btnAddHeader">+ Add Header</button>
              </div>
              <div id="headersContainer">
                <!-- Dynamic Header rows will be rendered here -->
              </div>
            </div>

            <!-- Body Pane -->
            <div class="tab-pane fade" id="body-pane" role="tabpanel">
              <div class="mb-3">
                <div class="form-check form-check-inline">
                  <input class="form-check-input" type="radio" name="bodyType" id="bodyTypeNone" value="none" checked />
                  <label class="form-check-label text-muted" for="bodyTypeNone">none</label>
                </div>
                <div class="form-check form-check-inline">
                  <input class="form-check-input" type="radio" name="bodyType" id="bodyTypeJson" value="json" />
                  <label class="form-check-label" for="bodyTypeJson">raw (JSON)</label>
                </div>
                <div class="form-check form-check-inline">
                  <input class="form-check-input" type="radio" name="bodyType" id="bodyTypeForm" value="form" />
                  <label class="form-check-label" for="bodyTypeForm">x-www-form-urlencoded</label>
                </div>
              </div>

              <!-- JSON Body Editor -->
              <div id="jsonBodySection" class="d-none">
                <div class="d-flex justify-content-between align-items-center mb-2">
                  <small class="text-muted">JSON Request Body</small>
                  <button type="button" class="btn btn-sm btn-outline-secondary" id="btnFormatJson">Prettify JSON</button>
                </div>
                <textarea
                  id="jsonstring"
                  class="form-control kv-input"
                  rows="6"
                  placeholder='{\n  "title": "foo",\n  "body": "bar",\n  "userId": 1\n}'
                ></textarea>
              </div>

              <!-- Form Body Editor -->
              <div id="formBodySection" class="d-none">
                <div class="d-flex justify-content-between align-items-center mb-2">
                  <small class="text-muted">Form Key-Value Pairs</small>
                  <button type="button" class="btn btn-sm btn-outline-primary" id="btnAddFormParam">+ Add Key-Value</button>
                </div>
                <div id="formBodyContainer">
                  <!-- Dynamic Form Body rows -->
                </div>
              </div>
            </div>

            <!-- Auth Pane -->
            <div class="tab-pane fade" id="auth-pane" role="tabpanel">
              <div class="row g-3">
                <div class="col-md-4">
                  <label class="form-label text-muted">Auth Type</label>
                  <select class="form-select kv-input" id="authType">
                    <option value="none" selected>No Auth</option>
                    <option value="bearer">Bearer Token</option>
                    <option value="basic">Basic Auth</option>
                  </select>
                </div>
                <div class="col-md-8 d-none" id="bearerAuthBox">
                  <label class="form-label text-muted">Token</label>
                  <input type="text" class="form-control kv-input" id="authToken" placeholder="e.g. eyJhbGciOiJIUzI1Ni..." />
                </div>
                <div class="col-md-4 d-none basicAuthBox">
                  <label class="form-label text-muted">Username</label>
                  <input type="text" class="form-control kv-input" id="authUsername" placeholder="Username" />
                </div>
                <div class="col-md-4 d-none basicAuthBox">
                  <label class="form-label text-muted">Password</label>
                  <input type="password" class="form-control kv-input" id="authPassword" placeholder="Password" />
                </div>
              </div>
            </div>
          </div>
        </div>
      </form>

      <!-- Response Card -->
      <div class="custom-card">
        <div class="response-header">
          <div class="d-flex align-items-center gap-3">
            <h5 class="m-0 fw-bold">Response</h5>
            <span id="responseStatusBadge" class="status-badge d-none">200 OK</span>
          </div>
          <div class="response-meta d-none" id="responseMeta">
            <span>Time: <strong id="responseTime" class="text-light">0 ms</strong></span>
            <span>Size: <strong id="responseSize" class="text-light">0 B</strong></span>
          </div>
        </div>

        <ul class="nav nav-tabs custom-nav-tabs mb-3" id="responseTabs" role="tablist">
          <li class="nav-item" role="presentation">
            <button class="nav-link active" id="resp-pretty-tab" data-bs-toggle="tab" data-bs-target="#resp-pretty-pane" type="button" role="tab">Pretty</button>
          </li>
          <li class="nav-item" role="presentation">
            <button class="nav-link" id="resp-headers-tab" data-bs-toggle="tab" data-bs-target="#resp-headers-pane" type="button" role="tab">Headers</button>
          </li>
          <li class="nav-item ms-auto" role="presentation">
            <button class="btn btn-sm btn-outline-light d-flex align-items-center gap-1" id="btnCopyResponse">
              <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"></path></svg>
              <span>Copy</span>
            </button>
          </li>
        </ul>

        <div class="tab-content">
          <div class="tab-pane fade show active" id="resp-pretty-pane" role="tabpanel">
            <div id="responsetext" class="response-box">Submit a request to see the response here...</div>
          </div>
          <div class="tab-pane fade" id="resp-headers-pane" role="tabpanel">
            <div id="responseHeadersBox" class="response-box text-muted">No response headers yet</div>
          </div>
        </div>
      </div>
    </div>

    <!-- History Offcanvas -->
    <div class="offcanvas offcanvas-end" tabindex="-1" id="historyOffcanvas" aria-labelledby="historyOffcanvasLabel">
      <div class="offcanvas-header">
        <h5 class="offcanvas-title fw-bold" id="historyOffcanvasLabel">Request History</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Close"></button>
      </div>
      <div class="offcanvas-body">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <small class="text-muted">Recent API Calls</small>
          <button class="btn btn-sm btn-outline-danger" id="btnClearHistory">Clear All</button>
        </div>
        <div id="historyList">
          <div class="text-center text-muted py-4">No history recorded yet</div>
        </div>
      </div>
    </div>

    <!-- Bootstrap Bundle JS -->
    <script src="assets/bootstrap/js/bootstrap.bundle.min.js"></script>
    <!-- SweetAlert2 -->
    <script src="assets/js/sweetalert/sweetalert2.js"></script>
    <!-- Main Script -->
    <script src="assets/js/script.js" type="module"></script>
  </body>
</html>
