<!DOCTYPE html>
<html lang="en">
  <head>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%20fill%3D%22none%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22g%22%20x1%3D%220%25%22%20y1%3D%220%25%22%20x2%3D%22100%25%22%20y2%3D%22100%25%22%3E%3Cstop%20offset%3D%220%25%22%20stop-color%3D%22%23F43F5E%22%2F%3E%3Cstop%20offset%3D%22100%25%22%20stop-color%3D%22%238B5CF6%22%2F%3E%3C%2FlinearGradient%3E%3C%2Fdefs%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2216%22%20fill%3D%22%23170a18%22%2F%3E%3Crect%20x%3D%222%22%20y%3D%222%22%20width%3D%2260%22%20height%3D%2260%22%20rx%3D%2214%22%20stroke%3D%22url(%23g)%22%20stroke-width%3D%222%22%20stroke-opacity%3D%220.6%22%2F%3E%3Ctext%20x%3D%2214%22%20y%3D%2238%22%20font-family%3D%22monospace%22%20font-size%3D%2218%22%20font-weight%3D%22bold%22%20fill%3D%22%23F43F5E%22%3E%5B%3C%2Ftext%3E%3Ctext%20x%3D%2244%22%20y%3D%2238%22%20font-family%3D%22monospace%22%20font-size%3D%2218%22%20font-weight%3D%22bold%22%20fill%3D%22%23F43F5E%22%3E%5D%3C%2Ftext%3E%3Ccircle%20cx%3D%2226%22%20cy%3D%2232%22%20r%3D%224%22%20fill%3D%22%238B5CF6%22%2F%3E%3Ccircle%20cx%3D%2238%22%20cy%3D%2232%22%20r%3D%224%22%20fill%3D%22%238B5CF6%22%2F%3E%3Cpath%20d%3D%22M26%2040c4%204%208%204%2012%200%22%20stroke%3D%22%23F43F5E%22%20stroke-width%3D%222%22%2F%3E%3C%2Fsvg%3E">
  <link rel="shortcut icon" href="favicon.svg">
  <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Array Repeated Value Counter</title>
    <meta name="description" content="Calculate frequency and repeated values in an array or string instantly." />
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body>
    <div class="app-wrapper">
      <header class="header">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%20fill%3D%22none%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22g%22%20x1%3D%220%25%22%20y1%3D%220%25%22%20x2%3D%22100%25%22%20y2%3D%22100%25%22%3E%3Cstop%20offset%3D%220%25%22%20stop-color%3D%22%23F43F5E%22%2F%3E%3Cstop%20offset%3D%22100%25%22%20stop-color%3D%22%238B5CF6%22%2F%3E%3C%2FlinearGradient%3E%3C%2Fdefs%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2216%22%20fill%3D%22%23170a18%22%2F%3E%3Crect%20x%3D%222%22%20y%3D%222%22%20width%3D%2260%22%20height%3D%2260%22%20rx%3D%2214%22%20stroke%3D%22url(%23g)%22%20stroke-width%3D%222%22%20stroke-opacity%3D%220.6%22%2F%3E%3Ctext%20x%3D%2214%22%20y%3D%2238%22%20font-family%3D%22monospace%22%20font-size%3D%2218%22%20font-weight%3D%22bold%22%20fill%3D%22%23F43F5E%22%3E%5B%3C%2Ftext%3E%3Ctext%20x%3D%2244%22%20y%3D%2238%22%20font-family%3D%22monospace%22%20font-size%3D%2218%22%20font-weight%3D%22bold%22%20fill%3D%22%23F43F5E%22%3E%5D%3C%2Ftext%3E%3Ccircle%20cx%3D%2226%22%20cy%3D%2232%22%20r%3D%224%22%20fill%3D%22%238B5CF6%22%2F%3E%3Ccircle%20cx%3D%2238%22%20cy%3D%2232%22%20r%3D%224%22%20fill%3D%22%238B5CF6%22%2F%3E%3Cpath%20d%3D%22M26%2040c4%204%208%204%2012%200%22%20stroke%3D%22%23F43F5E%22%20stroke-width%3D%222%22%2F%3E%3C%2Fsvg%3E">
  <link rel="shortcut icon" href="favicon.svg">
  <h1>Array Value Analyzer</h1>
        <p>Analyze frequency & sequential occurrences of characters or array values</p>
      </header>

      <nav class="nav-tabs" aria-label="Mode Navigation">
        <a href="index.html" class="nav-tab active">Frequency Count</a>
        <a href="GetSeqWiseCountVal.html" class="nav-tab">Sequence-wise Count</a>
      </nav>

      <main class="card">
        <div class="form-group">
          <div class="form-label">
            <label for="UserString">Enter String / Array Items</label>
            <span>Type or paste below</span>
          </div>
          <textarea 
            id="UserString" 
            placeholder="e.g. aaabbcdddd or 1,2,2,3,3,3"
            spellcheck="false"
          ></textarea>

          <div class="quick-samples">
            <span class="sample-title">Try sample:</span>
            <button class="chip" data-val="aabbbccdddd">aabbbccdddd</button>
            <button class="chip" data-val="mississippi">mississippi</button>
            <button class="chip" data-val="11223334444">11223334444</button>
          </div>
        </div>

        <div class="action-row">
          <button type="button" id="check" class="btn btn-primary">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
            Count Repeated Values
          </button>
          <button type="button" id="clear_btn" class="btn btn-secondary">Clear</button>
        </div>

        <section class="output-section">
          <div class="output">
            <div class="empty-state">
              Enter text above and press "Count Repeated Values" to view results.
            </div>
          </div>
        </section>
      </main>
    </div>

    <script src="assets/js/script.js"></script>
  </body>
</html>
