<style>
  :root{
    --bg:#0a0d13;
    --bg2:#0d1119;
    --panel:#11151f;
    --panel-hover:#161c29;
    --text:#e4e9f2;
    --muted:#727d92;
    --muted-dim:#4b5468;
    --border:#212838;
    --border-soft:#1a2030;
    --accent:#59e0c9;
    --accent-dim:#2f6e64;
    --shadow: 0 16px 40px rgba(0,0,0,.45);

    --c-system:#7c9bff;
    --c-tools:#f5b04d;
    --c-demo:#f56c8c;
    --c-learning:#59e0c9;
    --c-portfolio:#b98cf2;
    --c-default:#8b93a7;
  }
  [data-theme="light"]{
    --bg:#f3f5fa;
    --bg2:#ffffff;
    --panel:#ffffff;
    --panel-hover:#f0f3fb;
    --text:#161a24;
    --muted:#5c6478;
    --muted-dim:#98a0b3;
    --border:#e2e6f0;
    --border-soft:#eceef5;
    --accent:#0f9d86;
    --accent-dim:#bfece3;
    --shadow: 0 12px 28px rgba(30,40,80,.10);
  }

  *{box-sizing:border-box;}
  ::selection{ background:var(--accent); color:#04110d; }

  body{
    margin:0;
    font-family:'Inter', system-ui, -apple-system, Roboto, sans-serif;
    background:
      radial-gradient(circle at 15% -10%, color-mix(in srgb, var(--accent) 10%, transparent), transparent 45%),
      var(--bg);
    background-attachment:fixed;
    color:var(--text);
    min-height:100vh;
    transition:background .3s ease, color .3s ease;
  }
  code, .mono{ font-family:'JetBrains Mono', ui-monospace, Menlo, monospace; }

  a{ color:inherit; }
  :focus-visible{
    outline:2px solid var(--accent);
    outline-offset:2px;
    border-radius:6px;
  }

  /* ---------- terminal chrome header ---------- */
  .window{
    max-width:1000px;
    margin:40px auto 0;
    padding:0 20px;
  }
  .titlebar{
    display:flex;
    align-items:center;
    gap:10px;
    background:var(--panel);
    border:1px solid var(--border);
    border-bottom:none;
    border-radius:12px 12px 0 0;
    padding:11px 16px;
  }
  .dot{ width:11px; height:11px; border-radius:50%; }
  .dot.red{ background:#f56c6c; }
  .dot.yellow{ background:#f5c04d; }
  .dot.green{ background:#59e084; }
  .titlebar .path{
    margin-left:8px;
    font-size:12.5px;
    color:var(--muted);
    letter-spacing:.2px;
  }

  header{
    background:var(--bg2);
    border:1px solid var(--border);
    border-radius:0 0 12px 12px;
    padding:34px 28px 30px;
  }
  .prompt-line{
    font-size:13px;
    color:var(--muted-dim);
    margin-bottom:14px;
    display:flex;
    gap:8px;
  }
  .prompt-line .sym{ color:var(--accent); }

  h1.title{
    margin:0;
    font-family:'JetBrains Mono', monospace;
    font-size:clamp(24px,4.4vw,38px);
    font-weight:800;
    letter-spacing:-.5px;
    line-height:1.15;
  }
  h1.title .rem{ color:var(--muted-dim); font-weight:500; }
  h1.title .accent{ color:var(--accent); }

  .subtitle{
    color:var(--muted);
    margin-top:12px;
    font-size:14.5px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .subtitle .cursor{
    display:inline-block;
    width:8px; height:16px;
    background:var(--accent);
    animation:blink 1.1s steps(1) infinite;
    vertical-align:-3px;
  }
  @keyframes blink{ 50%{ opacity:0; } }

  .theme-toggle{
    position:absolute;
    top:0; right:0;
    background:transparent;
    border:1px solid var(--border);
    color:var(--muted);
    padding:7px 13px;
    border-radius:8px;
    cursor:pointer;
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    transition:.18s;
  }
  .titlebar{ position:relative; }
  .theme-toggle{ position:static; margin-left:auto; }
  .theme-toggle:hover{ color:var(--text); border-color:var(--accent); }

  /* ---------- controls ---------- */
  .controls{
    max-width:1000px;
    margin:26px auto 0;
    padding:0 20px;
  }
  .search-wrap{
    display:flex;
    align-items:center;
    gap:10px;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:10px;
    padding:13px 16px;
    transition:.18s;
  }
  .search-wrap:focus-within{
    border-color:var(--accent);
    box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 16%, transparent);
  }
  .search-wrap .sym{
    color:var(--accent);
    font-family:'JetBrains Mono', monospace;
    font-size:14px;
  }
  .search-wrap input{
    flex:1;
    border:none;
    outline:none;
    background:transparent;
    color:var(--text);
    font-family:'JetBrains Mono', monospace;
    font-size:14px;
  }
  .search-wrap input::placeholder{ color:var(--muted-dim); }

  .filters{
    max-width:1000px;
    margin:16px auto 0;
    padding:0 20px;
    display:flex;
    gap:8px;
    flex-wrap:wrap;
  }
  .chip{
    display:flex;
    align-items:center;
    gap:7px;
    padding:7px 14px;
    border-radius:8px;
    border:1px solid var(--border);
    background:var(--panel);
    color:var(--muted);
    font-family:'JetBrains Mono', monospace;
    font-size:12.5px;
    cursor:pointer;
    user-select:none;
    transition:.16s;
    white-space:nowrap;
  }
  .chip .swatch{
    width:7px; height:7px; border-radius:2px;
    background:var(--muted-dim);
  }
  .chip:hover{ color:var(--text); border-color:var(--border-soft); background:var(--panel-hover); }
  .chip.active{
    color:var(--text);
    border-color:var(--accent);
    background:color-mix(in srgb, var(--accent) 10%, var(--panel));
  }

  .stats{
    max-width:1000px;
    margin:16px auto 0;
    padding:0 20px;
    color:var(--muted-dim);
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
  }

  /* ---------- grid ---------- */
  .grid{
    max-width:1000px;
    margin:14px auto 0;
    padding:16px 20px 90px;
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
    gap:12px;
  }

  .card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:10px;
    padding:16px 18px;
    text-decoration:none;
    color:var(--text);
    display:flex;
    flex-direction:column;
    gap:9px;
    position:relative;
    overflow:hidden;
    transition:transform .16s ease, box-shadow .16s ease, border-color .16s ease, background .16s ease;
    opacity:0;
    animation:fadeUp .4s ease forwards;
  }
  .card::before{
    content:"";
    position:absolute;
    left:0; top:0; bottom:0;
    width:3px;
    background:var(--row-color, var(--c-default));
    opacity:.9;
  }
  .card:hover{
    transform:translateY(-3px);
    box-shadow:var(--shadow);
    border-color:var(--row-color, var(--accent));
    background:var(--panel-hover);
  }
  .card .top-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }
  .card .badge{
    font-family:'JetBrains Mono', monospace;
    font-size:10.5px;
    font-weight:700;
    letter-spacing:.6px;
    padding:3px 7px;
    border-radius:5px;
    color:var(--row-color, var(--c-default));
    background:color-mix(in srgb, var(--row-color, var(--c-default)) 16%, transparent);
    white-space:nowrap;
  }
  .card .arrow{
    color:var(--muted-dim);
    font-family:'JetBrains Mono', monospace;
    font-size:13px;
    opacity:0;
    transform:translateX(-4px);
    transition:.16s;
  }
  .card:hover .arrow{ opacity:1; transform:translateX(0); color:var(--row-color, var(--accent)); }

  .card .name{
    font-weight:700;
    font-size:14.5px;
    line-height:1.35;
  }
  .card .path{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    color:var(--muted-dim);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  @keyframes fadeUp{
    from{ opacity:0; transform:translateY(10px); }
    to{ opacity:1; transform:translateY(0); }
  }
  @media (prefers-reduced-motion: reduce){
    .card{ animation:none; opacity:1; }
    .subtitle .cursor{ animation:none; }
  }

  .empty{
    text-align:center;
    color:var(--muted);
    font-family:'JetBrains Mono', monospace;
    font-size:13.5px;
    padding:60px 20px;
    display:none;
  }
  .empty.show{ display:block; }
  .empty .cursor2{
    display:inline-block; width:7px; height:14px;
    background:var(--accent); vertical-align:-2px;
    animation:blink 1.1s steps(1) infinite;
  }

  footer{
    max-width:1000px;
    margin:0 auto;
    padding:20px 20px 40px;
    color:var(--muted-dim);
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    border-top:1px solid var(--border-soft);
  }
</style>
</head>

<script>
  // =====================================================================
  // 👇 NAYA PROJECT ADD KARNE KE LIYE: bas is list me EK line add karo.
  // Sirf "name" aur "href" zaroori hai. category/icon AUTO-DETECT ho jayega
  // niche diye gaye keyword rules se (KEYWORD_RULES array me).
  // Agar auto-detect galat ho ya khud control karna ho, to teesra/chautha
  // field { cat:"...", icon:"..." } manually bhi de sakte ho — wo priority
  // lega auto-detect ke upar.
  // =====================================================================
  const projects = [
    { name:"user-templates", href:"user-templates/index.html" },
    { name:"Datatable example", href:"datatable-example/index.html" },
    { name:"Generate Strong Password", href:"genrate_strong_password-using-javascript/index.html" },
    { name:"Strong Your Password", href:"strong_your_password/" },
    { name:"Read Jokes (Call Joke API)", href:"js-21(call joke api)/" },
    { name:"Find Your IP Info", href:"findmyipinfo/" },
    { name:"Find Coordinate", href:"find coord/index.html" },
    { name:"Age Calculator", href:"agecalc/index.html" },
    { name:"Validation using Notify Demo", href:"validation_using_notify_message/index.html" },
    { name:"Toastr Demo", href:"toastr/index.html" },
    { name:"jQuery Validation Plugin", href:"jqueryvalidationplugin/" },
    { name:"Guess The Number (JS)", href:"guessthenumber/index.html" },
    { name:"Portfolio", href:"portfolio/index.html" },
    { name:"Todo (Using LocalStorage)", href:"todo(localstorage)/index.html" },
    { name:"String Repeated Value", href:"getarrayrepeatedvalue/index.html" },
    { name:"Number To Word", href:"numbertoword/index.html" },
    { name:"Postman", href:"postman/index.html" },
    { name:"GUID Generator", href:"guid/index.html" },
    { name:"File Info", href:"fileinfo/index.html" },
    { name:"Kendo Grid", href:"Kendogrid/index.html" },
    { name:"View Image (JS)", href:"viewimage/index.html" },
    { name:"Upload Image (Base64 + LocalStorage)", href:"UploadImageInLocalStorage/index.html" },
    { name:"Queue Base Task System", href:"TaskBaseQueueSystem/index.html" },
    { name:"Project System", href:"userbaseprojectsystem/index.html" },
    { name:"Appointment Scheduler", href:"Appointment Scheduler/index.html" },
    { name:"Subscription Scheduler", href:"Subscription/index.html" },
    { name:"HRM UI", href:"hrmui/index.html" },
    { name:"Khodiyar Jewellers", href:"Khodiyar jwellers/index.html" },
    { name:"DSA Questions", href:"DSAQuestions/index.html" },
    { name:"Library Management System", href:"LibraryManagementSystem/index.html" },
    { name:"Restaurant Management System", href:"restaurantmanagementsystem/index.html" },
    { name:"Jewellery Management System", href:"jewellery management system/index.html" },
    { name:"Hospital Management System", href:"Hospital Management System/index.html" },
    { name:"Hotel Management System", href:"HotelManagementSystem/index.html" },
    { name:"Appointment Management System", href:"Appointment Management System/index.html" },
    { name:"MD Reader", href:"mdreader/index.html" },
    { name:"HR Outreach Generator", href:"HR Outreach Generator/hr-email-generator.html" },
    { name:"Banana Prompt Builder", href:"Banana Prompt Builder/index.html" },
    { name:"Seat Booking & Billing System", href:"Seat Booking & Billing System/index.html" },
    { name:"Resume", href:"resume/index.html" },
    { name:"e-commerce", href:"e-commerce/index.html" },
    { name:"Text To QR Code", href:"TextToQR/index.html" },
    { name:"Resumebuilder", href:"Resumebuilder/index.html" },
    { name:"ExpenseTracker", href:"ExpenseTracker/index.html" },
    { name:"Unit Converter", href:"Unit Converter/index.html" },
    { name:"Pomodoro Timer", href:"Pomodoro Timer/index.html" },
    { name:"Note-Taking", href:"Note-Taking/index.html" },
    { name:"Habit Tracker with Streak Counter", href:"Habit Tracker with Streak Counter/index.html" },
    { name:"DevDocs", href:"TutorialStudio/index.html" },
    { name:"Barcode  - Label Generator", href:"Barcode  - Label Generator/index.html" },
    { name:"Image Compressor", href:"Image Compressor/index.html" },
    { name:"File Converter", href:"File Converter/index.html" },
    { name:"Interview Questions (.NET & SQL)", href:"InterviewQuestion/index.html", cat:"Learning", abbr:"LRN" }

    // 👉 Example: naya project add karna ho to bas yeh copy-paste karke edit karo:
    // { name:"Your New Project Name", href:"your-folder/index.html" },
  ];

  // Keyword → {category, abbr} rules. Order matters: pehla match jeetta hai.
  // Naya keyword pattern add karna ho to bas is array me ek line add karo.
  const KEYWORD_RULES = [
    { keywords:["resume", "portfolio"], cat:"Portfolio", abbr:"POR" },
    { keywords:["hospital"], cat:"System", abbr:"SYS" },
    { keywords:["hotel"], cat:"System", abbr:"SYS" },
    { keywords:["restaurant"], cat:"System", abbr:"SYS" },
    { keywords:["jewel"], cat:"System", abbr:"SYS" },
    { keywords:["library"], cat:"System", abbr:"SYS" },
    { keywords:["appointment", "scheduler", "subscription", "booking", "seat"], cat:"System", abbr:"SYS" },
    { keywords:["hrm", "hr outreach", "hr email"], cat:"System", abbr:"SYS" },
    { keywords:["queue", "project system"], cat:"System", abbr:"SYS" },
    { keywords:["dsa", "question"], cat:"Learning", abbr:"LRN" },
    { keywords:["password"], cat:"Tools", abbr:"TUL" },
    { keywords:["ip info", "coordinate", "guid", "file info", "md reader", "number to word", "postman", "prompt builder", "template", "converter", "compressor", "barcode"], cat:"Tools", abbr:"TUL" },
    { keywords:["todo", "tracker", "timer", "note-taking"], cat:"Demo", abbr:"DEM" },
    { keywords:["joke"], cat:"Demo", abbr:"DEM" },
    { keywords:["image"], cat:"Demo", abbr:"DEM" },
    { keywords:["grid", "datatable"], cat:"Demo", abbr:"DEM" },
    { keywords:["validation", "toastr", "notify"], cat:"Demo", abbr:"DEM" },
    { keywords:["guess the number"], cat:"Demo", abbr:"DEM" },
    { keywords:["string repeated", "repeated value"], cat:"Demo", abbr:"DEM" }
  ];

  const DEFAULT_RULE = { cat:"Demo", abbr:"DEM" };

  const CAT_COLOR_VAR = {
    "System":"--c-system",
    "Tools":"--c-tools",
    "Demo":"--c-demo",
    "Learning":"--c-learning",
    "Portfolio":"--c-portfolio"
  };

  // Auto-detect karta hai category/abbr, agar project me manually nahi diya
  function autoDetect(name){
    const lower = name.toLowerCase();
    for (const rule of KEYWORD_RULES){
      if (rule.keywords.some(k => lower.includes(k))) return rule;
    }
    return DEFAULT_RULE;
  }

  // Har project ko normalize karo: agar cat/abbr manually diya hai to wahi use hoga,
  // warna auto-detect se fill ho jayega.
  projects.forEach(p => {
    const detected = autoDetect(p.name);
    p.cat = p.cat || detected.cat;
    p.abbr = p.abbr || detected.abbr;
    p.colorVar = CAT_COLOR_VAR[p.cat] || "--c-default";
  });

  const grid = document.getElementById('grid');
  const searchInput = document.getElementById('searchInput');
  const filtersEl = document.getElementById('filters');
  const statsEl = document.getElementById('stats');
  const emptyState = document.getElementById('emptyState');
  const totalCount = document.getElementById('totalCount');

  totalCount.textContent = projects.length;

  const categories = ["All", ...Array.from(new Set(projects.map(p => p.cat)))];
  let activeCat = "All";
  let query = "";

  function renderChips(){
    filtersEl.innerHTML = "";
    categories.forEach(cat => {
      const chip = document.createElement('div');
      chip.className = "chip" + (cat === activeCat ? " active" : "");
      chip.tabIndex = 0;
      chip.setAttribute('role', 'button');
      chip.setAttribute('aria-pressed', cat === activeCat ? 'true' : 'false');

      const swatch = document.createElement('span');
      swatch.className = "swatch";
      if (cat !== "All") swatch.style.background = `var(${CAT_COLOR_VAR[cat] || '--c-default'})`;
      chip.appendChild(swatch);
      chip.appendChild(document.createTextNode(cat));

      const activate = () => { activeCat = cat; renderChips(); renderGrid(); };
      chip.onclick = activate;
      chip.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); activate(); } };
      filtersEl.appendChild(chip);
    });
  }

  function renderGrid(){
    const q = query.trim().toLowerCase();
    const filtered = projects.filter(p => {
      const matchesCat = activeCat === "All" || p.cat === activeCat;
      const matchesQuery = !q || p.name.toLowerCase().includes(q) || p.cat.toLowerCase().includes(q);
      return matchesCat && matchesQuery;
    });

    grid.innerHTML = "";
    filtered.forEach((p, i) => {
      const a = document.createElement('a');
      a.className = "card";
      a.href = p.href;
      a.style.setProperty('--row-color', `var(${p.colorVar})`);
      a.style.animationDelay = (i * 0.015) + "s";
      a.innerHTML = `
        <div class="top-row">
          <span class="badge">${p.abbr}</span>
          <span class="arrow">→ open</span>
        </div>
        <div class="name">${p.name}</div>
        <div class="path mono">./${p.href}</div>
      `;
      grid.appendChild(a);
    });

    emptyState.classList.toggle('show', filtered.length === 0);
    statsEl.textContent = `${filtered.length} of ${projects.length} matched · category: ${activeCat.toLowerCase()}`;
  }

  searchInput.addEventListener('input', (e) => {
    query = e.target.value;
    renderGrid();
  });

  // Theme toggle — persisted via localStorage since this page is a real
  // deployed static site, not a sandboxed artifact.
  const themeToggle = document.getElementById('themeToggle');
  function applyTheme(light){
    document.documentElement.setAttribute('data-theme', light ? 'light' : 'dark');
    themeToggle.textContent = light ? 'theme: light' : 'theme: dark';
  }
  let savedTheme = null;
  try { savedTheme = localStorage.getItem('spx-theme'); } catch(e) {}
  const prefersLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
  let isLight = savedTheme ? savedTheme === 'light' : prefersLight;
  applyTheme(isLight);
  themeToggle.addEventListener('click', () => {
    isLight = !isLight;
    applyTheme(isLight);
    try { localStorage.setItem('spx-theme', isLight ? 'light' : 'dark'); } catch(e) {}
  });

  renderChips();
  renderGrid();
</script>
</body>
</html>
