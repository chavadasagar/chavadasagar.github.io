  <link rel="shortcut icon" href="favicon.svg">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Library Seat Booking & Billing System</title>
  
  <!-- Style Sheet -->
  <link rel="stylesheet" href="style.css">
  
  <!-- Google Fonts (Outfit) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Lucide Vector Icons Library via CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <!-- ==========================================
       1. LOGIN SECTION
       ========================================== -->
  <section id="login-section" style="display: none;"></section>

  <!-- ==========================================
       2. MAIN APP FRAME (SIDEBAR + CONTENT)
       ========================================== -->
  <div id="app-container" style="display: none;">
    <!-- Sidebar Navigation -->
    <aside id="sidebar-container" class="sidebar"></aside>
    
    <!-- Mobile Sidebar Drawer Backdrop -->
    <div id="sidebar-backdrop" class="sidebar-backdrop"></div>

    <!-- Main Workspace Area -->
    <main class="main-content">
      <!-- Top header bar (Title, User, Alerts) -->
      <header id="header-container" class="header">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%20fill%3D%22none%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22g%22%20x1%3D%220%25%22%20y1%3D%220%25%22%20x2%3D%22100%25%22%20y2%3D%22100%25%22%3E%3Cstop%20offset%3D%220%25%22%20stop-color%3D%22%23DC2626%22%2F%3E%3Cstop%20offset%3D%22100%25%22%20stop-color%3D%22%23F59E0B%22%2F%3E%3C%2FlinearGradient%3E%3C%2Fdefs%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2216%22%20fill%3D%22%23180a0b%22%2F%3E%3Crect%20x%3D%222%22%20y%3D%222%22%20width%3D%2260%22%20height%3D%2260%22%20rx%3D%2214%22%20stroke%3D%22url(%23g)%22%20stroke-width%3D%222%22%20stroke-opacity%3D%220.6%22%2F%3E%3Cpath%20d%3D%22M16%2020h32v18a6%206%200%2001-6%206H22a6%206%200%2001-6-6V20z%22%20stroke%3D%22url(%23g)%22%20stroke-width%3D%222.5%22%20fill%3D%22%232d1114%22%2F%3E%3Cpath%20d%3D%22M12%2026v16M52%2026v16M22%2050v-6M42%2050v-6%22%20stroke%3D%22url(%23g)%22%20stroke-width%3D%222.5%22%20stroke-linecap%3D%22round%22%2F%3E%3Ccircle%20cx%3D%2232%22%20cy%3D%2230%22%20r%3D%223%22%20fill%3D%22%23F59E0B%22%2F%3E%3C%2Fsvg%3E">
  <link rel="shortcut icon" href="favicon.svg">
  </header>

      <!-- View Content Containers (Toggled via Hash Router) -->
      <div class="content-wrapper">
        <!-- ADMIN VIEWS -->
        <section id="admin-dashboard-view" class="app-view"></section>
        <section id="admin-users-view" class="app-view"></section>
        <section id="admin-seats-view" class="app-view"></section>
        <section id="admin-book-behalf-view" class="app-view"></section>
        <section id="admin-verify-payments-view" class="app-view"></section>
        <section id="admin-billing-view" class="app-view"></section>
        <section id="admin-settings-view" class="app-view"></section>

        <!-- USER VIEWS -->
        <section id="user-dashboard-view" class="app-view"></section>
        <section id="user-book-seat-view" class="app-view"></section>
        <section id="user-bookings-view" class="app-view"></section>
        <section id="user-billing-view" class="app-view"></section>
      </div>
    </main>
  </div>

  <!-- ==========================================
       3. FLOATING SYSTEM TOASTS CONTAINER
       ========================================== -->
  <div id="toast-container"></div>

  <!-- ==========================================
       4. SCRIPTS (Loaded Sequentially for Global Namespace)
       ========================================== -->
  <script src="js/db.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/seats.js"></script>
  <script src="js/bookings.js"></script>
  <script src="js/payments.js"></script>
  <script src="js/invoices.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
